<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Hush</title>
<style>
/* Grayscale tokens — same names as mobile.html. Light / dark (system) / forced via [data-theme]. */
:root{--bg:#f5f5f4;--card:#fff;--line:#e4e4e2;--ink:#161616;--mute:#8b8b88;--acc:#161616;--glow:#16161622;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f0f;--card:#1a1a1a;--line:#262626;--ink:#ececec;--mute:#777;--acc:#ececec;--glow:#ececec22;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f0f0f;--card:#1a1a1a;--line:#262626;--ink:#ececec;--mute:#777;--acc:#ececec;--glow:#ececec22;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden;user-select:none}
button{all:unset;cursor:pointer;color:var(--mute);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;position:relative;flex:none}
button:hover{background:var(--card);color:var(--ink)}button:focus-visible{box-shadow:0 0 0 2px var(--glow)}
button:disabled{opacity:.3;pointer-events:none}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Positions/sizes of #addr, #tabsbar, #page are set by layout() in JS — one source of truth, also sent to Rust. */
#addr{position:absolute;display:flex;gap:4px;align-items:center;padding:0 10px;background:var(--bg);z-index:3}
#addr.top{border-bottom:1px solid var(--line)}#addr.bottom{border-top:1px solid var(--line)}
#tabsbar{position:absolute;display:flex;align-items:center;gap:8px;background:var(--bg);z-index:2;transition:transform .18s ease}
#tabsbar.v{flex-direction:column;padding:10px 0}#tabsbar.h{flex-direction:row;padding:0 8px}
#tabsbar.left{border-right:1px solid var(--line)}#tabsbar.right{border-left:1px solid var(--line)}
#tabsbar.top{border-bottom:1px solid var(--line)}#tabsbar.bottom{border-top:1px solid var(--line)}
#tabsbar.hidden>*{opacity:0;pointer-events:none}
#tabsbar.hidden::after{content:"";position:absolute;background:var(--line);border-radius:2px}
#tabsbar.hidden.left::after{right:2px;top:50%;width:2px;height:40px;margin-top:-20px}
#tabsbar.hidden.right::after{left:2px;top:50%;width:2px;height:40px;margin-top:-20px}
#tabsbar.hidden.top::after{bottom:2px;left:50%;height:2px;width:40px;margin-left:-20px}
#tabsbar.hidden.bottom::after{top:2px;left:50%;height:2px;width:40px;margin-left:-20px}
#tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;min-width:0;min-height:0}
#tabsbar.v #tabs{flex-direction:column}
.tab{flex:none;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer;color:var(--mute);transition:.12s;overflow:hidden;white-space:nowrap}
#tabsbar.v .tab{width:38px;text-transform:uppercase}
#tabsbar.h .tab{height:28px;max-width:180px;padding:0 10px;font-weight:500}
#tabsbar.h .tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink)}.tab.on{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 3px var(--glow)}
.compact .tab{height:32px}.compact #tabsbar.v .tab{width:32px}.compact #tabsbar.h .tab{height:24px}

#pill{flex:1;display:flex;align-items:center;gap:6px;height:34px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 4px 0 12px;margin:0 6px;transition:border-color .15s,box-shadow .15s;min-width:0}
.compact #pill{height:30px}
#pill:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
#lock{width:12px;height:12px;color:var(--mute);flex:none}
#bar{all:unset;flex:1;color:var(--ink);font-size:13.5px;user-select:text;min-width:0}
#bar::placeholder{color:var(--mute)}
.badge{position:absolute;top:2px;right:0;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;display:none;place-items:center}
#shield.off{opacity:.4}#shield.off .badge{display:none!important}
#load{position:absolute;left:0;right:0;height:2px;background:var(--acc);transform-origin:left;transform:scaleX(0);opacity:0;transition:transform .4s,opacity .3s;z-index:4}
#load.on{opacity:1;transform:scaleX(.7);transition:transform 6s cubic-bezier(.1,.6,.2,1)}

#page{position:absolute;overflow:auto}
#home{height:100%;display:grid;place-content:center;justify-items:center;text-align:center;gap:26px}
#home h1{font:300 66px/1 ui-serif,"Times New Roman",Times,Georgia,serif;letter-spacing:-2px;margin-bottom:6px}#home p{color:var(--mute);margin-top:-18px}
#bms{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:560px}
.bm{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;width:68px;color:var(--mute);font-size:11px}
.bm i{font-style:normal;width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink);text-transform:uppercase}
.bm:hover i{border-color:var(--ink)}.bm span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Panels (Settings, Downloads) take the page area while open. */
.panel{max-width:640px;margin:0 auto;padding:28px 24px 60px;user-select:text}
.panel h2{font-weight:300;font-size:30px;letter-spacing:-.5px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:26px 0 8px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-height:50px}
.row>div:first-child{min-width:0}.row small{display:block;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{width:auto;height:26px;padding:0 10px;border-radius:7px;font-size:12px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.btn{width:auto;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:12px}
.sw{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:18px}
select,input.txt{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
input.txt{width:100%;margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.dl .state{font-size:11px;color:var(--mute)}.dl .acts{display:flex;gap:6px;flex:none}
.tab.priv{border-style:dashed}.tab.split{box-shadow:inset 0 -3px 0 var(--mute)}
.tab.drag{opacity:.4}.tab.over{transform:scale(1.08)}
#ws{width:38px;height:24px;border-radius:7px;font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line)}
#tabsbar.h #ws{width:auto;padding:0 8px}
#home .stats{color:var(--mute);font-size:12px;margin-top:-6px;font-variant-numeric:tabular-nums}
#home .stats b{color:var(--ink);font-weight:600}
#find{display:none;flex:1;gap:4px;align-items:center}#pill.finding #bar,#pill.finding #shield{display:none}#pill.finding #find{display:flex}
#findq{all:unset;flex:1;font-size:13.5px;user-select:text}#findn{color:var(--mute);font-size:12px}
.pal{max-width:620px}.pal input#palq{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.res{margin-top:10px;display:grid;gap:4px}
.res button{all:unset;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer;min-width:0}
.res button.sel,.res button:hover{background:var(--card)}
.res i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;text-transform:uppercase}
.res span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res small{color:var(--mute);margin-left:auto;flex:none;font-size:11px}
.qr{width:200px;height:200px;border-radius:12px;overflow:hidden;margin:0 auto;border:1px solid var(--line)}.qr svg{width:100%;height:100%;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{width:auto;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--ink)}
.row a{color:inherit}
.swatches{display:flex;gap:8px;align-items:center}.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mute)}
#toast{position:absolute;background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:99px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.on{opacity:1}
</style>

<div id=tabsbar>
  <button id=ws title="Workspace">P</button>
  <button id=new title="New tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id=tabs role=tablist aria-label="Tabs"></div>
</div>
<div id=addr>
  <button id=back title="Back (Alt+Left)" aria-label=Back disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id=fwd title="Forward (Alt+Right)" aria-label=Forward disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id=reload title="Reload (Ctrl+R)" aria-label=Reload disabled><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  <label id=pill>
    <svg id=lock viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2><rect x=5 y=11 width=14 height=9 rx=2 /><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <input id=bar placeholder="Search or enter address" autocomplete=off spellcheck=false aria-label="Address">
    <span id=find><input id=findq placeholder="Find in page — Enter: next · Shift+Enter: previous" aria-label="Find in page"><span id=findn></span>
      <button id=findp title="Previous (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button id=findx title="Close (Esc)" aria-label="Close find"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    <button id=shield title="Shield on for this site" aria-label="Toggle shield"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><b id=cnt class=badge></b></button>
  </label>
  <button id=read title="Reader view (Ctrl+E)" aria-label="Reader view" disabled><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg></button>
  <button id=pick title="Block an element" aria-label="Block an element" disabled><svg viewBox="0 0 24 24"><circle cx=6 cy=6 r=3 /><circle cx=6 cy=18 r=3 /><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/></svg></button>
  <button id=star title="Bookmark this page (Ctrl+D)" aria-label="Bookmark" disabled><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  <button id=dls title="Downloads (Ctrl+J)" aria-label="Downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><b id=dlcnt class=badge></b></button>
  <button id=gear title="Settings (Ctrl+,)" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx=12 cy=12 r=3 /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div id=load></div>
<div id=page>
  <div id=home><h1 class="wordmark">hush.</h1><p>nothing here but you.</p><div class=stats id=stats></div><div id=bms></div></div>
  <div id=panel class=panel hidden></div>
</div>
<div id=toast role=status></div>
<script src="qr.js"></script>

<script>
const T=window.__TAURI__, inv=(c,a)=>T.core.invoke(c,a), $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// tabs: [{id, url}] — url comes from Rust 'tab-url' events, never from what was typed.
let tabs=[], cur=null, allow=new Set(), counts={}, newPending=false, toastT, state={settings:{ui:{}},bookmarks:[]};
let panel=null, revealed=false, overBar=false, hideT=null, downloads=[];
const tab=id=>tabs.find(t=>t.id==id), hostOf=u=>{try{return new URL(u).hostname}catch{return''}};

// ---------- preferences (stored in Rust as ui.<name>) ----------
const DEF={tabs_pos:'left',tabs_mode:'auto',hide_delay:'3',bar_pos:'top',density:'normal',theme:'system',tab_style:'auto',
  bangs:'',memory_saver:'30',focus_sites:'youtube.com,reddit.com,x.com,instagram.com,tiktok.com,facebook.com',focus_until:'0',color:'graphite',force_dark:'false',history:'off',restore:'off',workspaces:'Personal',ws:'Personal'};
const pref=k=>state.settings.ui?.[k]??DEF[k];
async function setPref(k,v){state.settings.ui[k]=String(v);layout(true);try{await inv('set_setting',{key:'ui.'+k,value:String(v)})}catch(e){toast(String(e))}}

// ---------- layout: places bars, tells Rust where the page goes ----------
const EDGE=6;
// Browser color: a hue/saturation tints every surface; light and dark variants are derived from it.
const COLORS={graphite:null,sand:[35,32],sage:[145,20],ocean:[205,48],rose:[345,42],plum:[275,30],ember:[18,62]};
function hexHS(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60+360)%360}return[h,d?Math.round(d/(1-Math.abs(2*l-1))*100):0]}
function applyColor(){const c=pref('color'),v=/^#[0-9a-f]{6}$/i.test(c)?hexHS(c):COLORS[c],r=document.documentElement.style;
  const P=['--bg','--card','--line','--ink','--mute','--acc','--glow'];if(!v){P.forEach(p=>r.removeProperty(p));return}
  const [h,s]=v,dark=pref('theme')=='dark'||(pref('theme')=='system'&&matchMedia('(prefers-color-scheme: dark)').matches),H=(l,k)=>`hsl(${h} ${Math.round(s*k)}% ${l}%)`;
  const t=dark?{'--bg':H(8,.35),'--card':H(12,.35),'--line':H(21,.3),'--ink':H(93,.25),'--mute':H(60,.15),'--acc':H(68,1),'--glow':`hsl(${h} ${s}% 68% / .22)`}
             :{'--bg':H(95,.5),'--card':H(99,.6),'--line':H(87,.35),'--ink':H(12,.45),'--mute':H(48,.15),'--acc':H(40,1),'--glow':`hsl(${h} ${s}% 40% / .18)`};
  for(const k in t)r.setProperty(k,t[k])}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyColor);
function layout(now){
  applyColor();
  const c=pref('density')=='compact', B=c?44:52, V=c?54:64, Hs=c?36:42;
  const tp=pref('tabs_pos'), bp=pref('bar_pos'), vert=tp=='left'||tp=='right', auto=pref('tabs_mode')=='auto';
  const shown=!auto||revealed||!tabs.some(t=>t.ws==(typeof curWs=='function'?curWs():t.ws)), full=vert?V:Hs, used=shown?full:EDGE, slide=full-used;
  document.documentElement.dataset.theme=pref('theme')=='system'?'':pref('theme');
  document.body.classList.toggle('compact',c);
  const ins={top:0,right:0,bottom:0,left:0}, A=$('#addr'), S=$('#tabsbar'), P=$('#page'), L=$('#load');
  A.className=bp; S.className=(vert?'v ':'h ')+tp+(shown?'':' hidden');
  const px=o=>Object.entries(o).map(([k,v])=>`${k}:${typeof v=='number'?v+'px':v}`).join(';');
  if(vert){
    S.style.cssText=px({top:0,bottom:0,[tp]:0,width:full,transform:`translateX(${tp=='left'?-slide:slide}px)`});
    ins[tp]=used; ins[bp]=B;
    A.style.cssText=px({[bp]:0,height:B,left:tp=='left'?used:0,right:tp=='right'?used:0});
  }else{
    const stacked=tp==bp; // tab strip sits between the address bar and the page
    ins[bp]+=B; ins[tp]+=used;
    A.style.cssText=px({[bp]:0,height:B,left:0,right:0});
    S.style.cssText=px({left:0,right:0,height:full,[tp]:stacked?B:0,transform:`translateY(${tp=='top'?-slide:slide}px)`});
  }
  P.style.cssText=px({top:ins.top,right:ins.right,bottom:ins.bottom,left:ins.left});
  L.style.cssText=px({left:ins.left,right:ins.right,[bp=='top'?'top':'bottom']:B-1});
  const t=$('#toast');t.style.cssText=px({right:ins.right+12,top:ins.top+8});
  // Growing the page waits for the slide-out so it doesn't jump; shrinking happens at once.
  clearTimeout(layout.t);
  const send=()=>inv('set_layout',ins).catch(()=>{});
  if(now||shown) send(); else layout.t=setTimeout(send,180);
}
function reveal(on){
  if(pref('tabs_mode')!='auto')return;
  clearTimeout(hideT);
  if(on&&!revealed){revealed=true;layout()}
  if(!on&&revealed){revealed=false;layout()}
}
function scheduleHide(){clearTimeout(hideT);if(pref('tabs_mode')!='auto')return;
  hideT=setTimeout(()=>{if(!overBar)reveal(false)},Math.max(.5,+pref('hide_delay'))*1000)}
$('#tabsbar').addEventListener('mouseenter',()=>{overBar=true;reveal(true)});
$('#tabsbar').addEventListener('mouseleave',()=>{overBar=false;scheduleHide()});
const peek=()=>{reveal(true);if(!overBar)scheduleHide()};   // briefly show the tabs after a tab action
addEventListener('resize',()=>layout(true));

// ---------- workspaces ----------
const wsList=()=>pref('workspaces').split('|').filter(Boolean);
const curWs=()=>wsList().includes(pref('ws'))?pref('ws'):wsList()[0];
const inWs=()=>tabs.filter(t=>t.ws==curWs());
async function switchWs(name){await setPref('ws',name);const last=inWs().at(-1);if(last)select(last.id);else{cur=null;draw();sync()}
  $('#ws').textContent=name[0].toUpperCase();toast('Workspace: '+name);peek()}
async function addWs(name){name=name.trim().replace(/\|/g,'').slice(0,24);if(!name||wsList().includes(name))return;
  await setPref('workspaces',[...wsList(),name].join('|'));await switchWs(name)}
async function removeWs(name){if(wsList().length<2)return toast('Keep at least one workspace');
  for(const t of tabs.filter(t=>t.ws==name))await closeTab(t.id,true);
  await setPref('workspaces',wsList().filter(w=>w!=name).join('|'));if(pref('ws')==name)await switchWs(wsList()[0])}

// ---------- tabs ----------
let split=null, findOn=false, statsT=null;
function sync(){const t=tab(cur);inv('show_content',{visible:!panel&&!!t&&t.ws==curWs()}).catch(()=>{})}
function draw(){
  const box=$('#tabs');box.textContent='';const horiz=pref('tabs_pos')=='top'||pref('tabs_pos')=='bottom';
  inWs().forEach((t,i)=>{const d=document.createElement('div');const h=hostOf(t.url).replace(/^www\./,'');
    if(t.sleeping)d.style.opacity='.45';
    d.className='tab'+(t.id==cur?' on':'')+(t.priv?' priv':'')+(t.id==split?' split':'');
    d.title=(t.priv?'Private · ':'')+(h||'Loading…')+'\nShift-click: split view · Middle-click: close · Drag: reorder';
    if(horiz){d.innerHTML='<span></span>';d.firstChild.textContent=(t.priv?'◌ ':'')+(h||'Loading…')}else d.textContent=t.priv?'◌':(h?h[0]:i+1);
    d.setAttribute('role','tab');d.setAttribute('aria-selected',t.id==cur);d.draggable=true;
    d.onclick=e=>e.shiftKey?toggleSplit(t.id):select(t.id);d.onauxclick=e=>{e.preventDefault();if(e.button==1)closeTab(t.id)};
    d.oncontextmenu=e=>{e.preventDefault();toggleSplit(t.id)};
    d.ondragstart=e=>{e.dataTransfer.setData('text/hush-tab',t.id);d.classList.add('drag')};d.ondragend=()=>d.classList.remove('drag');
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const from=e.dataTransfer.getData('text/hush-tab');if(!from||from==t.id)return;
      const a=tabs.findIndex(x=>x.id==from),moved=tabs.splice(a,1)[0];tabs.splice(tabs.findIndex(x=>x.id==t.id),0,moved);draw();saveSession()};
    box.append(d)});
  $('#ws').textContent=curWs()[0].toUpperCase();$('#ws').title='Workspace: '+curWs()+' — click to switch';
  const t=tab(cur), live=t&&t.ws==curWs(), h=live?hostOf(t.url):'';
  if(document.activeElement!==$('#bar')) $('#bar').value=panel||!live?'':t.url;
  $('#home').style.display=!live&&!panel?'grid':'none';
  $('#panel').hidden=!panel;
  for(const id of ['back','fwd','reload','pick','star','read']) $('#'+id).disabled=!live||!!panel;
  $('#lock').style.visibility=live&&!panel&&t.url.startsWith('https:')?'visible':'hidden';
  const off=allow.has(h);$('#shield').classList.toggle('off',off);$('#shield').disabled=!h||!!panel;
  $('#shield').title=(off?'Shield off':'Shield on')+(h?' for '+h:'')+' — click for site settings';
  const n=counts[cur]||0;$('#cnt').textContent=n>99?'99+':n;$('#cnt').style.display=n&&live&&state.settings.counter!==false?'grid':'none';
  const a=downloads.filter(d=>d.state=='started').length;$('#dlcnt').textContent=a;$('#dlcnt').style.display=a?'grid':'none';
  if($('#home').style.display!='none')loadStats();
}
async function openTab(v,o={}){closePanel(true);newPending=false;
  const id=await inv('open_tab',{input:v,private:!!o.priv});tabs.push({id,url:'',priv:!!o.priv,ws:o.ws||curWs()});
  if(!o.background){cur=id}draw();layout();sync();if(!o.quiet)peek();return id}
async function wake(t){const id=await inv('open_tab',{input:t.url,private:t.priv});const old=t.id;t.id=id;t.sleeping=false;if(cur==old)cur=id;return id}
function select(id){closePanel(true);const t=tab(id);if(!t)return;t.last=Date.now();if(t.sleeping){wake(t).then(nid=>{cur=nid;draw();sync()});return}if(t.ws!=curWs()){state.settings.ui.ws=t.ws;inv('set_setting',{key:'ui.ws',value:t.ws})}
  cur=id;if(split==id){split=null;inv('set_split',{label:null})}inv('switch_tab',{label:id});draw();sync()}
async function closeTab(id,quiet){const next=await inv('close_tab',{label:id});tabs=tabs.filter(t=>t.id!=id);delete counts[id];if(split==id)split=null;
  const t=tab(next);cur=t&&t.ws==curWs()?next:(inWs().at(-1)?.id??null);if(cur&&cur!=next)inv('switch_tab',{label:cur});
  draw();layout();sync();saveSession();if(!quiet&&tabs.length)peek()}
function cycle(d){const w=inWs();if(w.length<2)return;const i=w.findIndex(t=>t.id==cur);select(w[(i+d+w.length)%w.length].id);peek()}
function toggleSplit(id){if(id==cur)return toast('Pick a different tab to split with');
  split=split==id?null:id;inv('set_split',{label:split});toast(split?'Split view — shift-click the tab again to close':'Split view closed');draw()}
function go(v){v=v.trim();if(!v)return;closePanel(true);if(newPending||!tab(cur)||tab(cur).ws!=curWs()){openTab(v,{priv:newPending=='priv'})}else inv('navigate',{input:v});newPending=false;$('#bar').blur()}
function newTab(priv){newPending=priv?'priv':true;$('#bar').value='';$('#bar').placeholder=priv?'New private tab — nothing is saved':'New tab — search or enter address';$('#bar').focus()}
let saveT;function saveSession(){if(pref('restore')!='on')return;clearTimeout(saveT);saveT=setTimeout(()=>
  inv('session_save',{tabs:tabs.filter(t=>!t.priv&&t.url.startsWith('https://')).map(t=>({url:t.url,ws:t.ws}))}).catch(()=>{}),800)}

// ---------- address bar + suggestions ----------
let sugSel=0, sugItems=[];
$('#bar').addEventListener('keydown',e=>{
  if(panel=='suggest'&&(e.key=='ArrowDown'||e.key=='ArrowUp')){e.preventDefault();sugSel=(sugSel+(e.key=='ArrowDown'?1:-1)+sugItems.length)%sugItems.length;renderSuggest(true);return}
  if(e.key=='Enter'){const it=panel=='suggest'&&sugItems[sugSel];it?runItem(it):go(e.target.value)}
  if(e.key=='Escape'){newPending=false;closePanel();e.target.blur();draw()}});
$('#bar').addEventListener('input',e=>{const v=e.target.value.trim();if(!v){if(panel=='suggest')closePanel();return}openPanel('suggest')});
$('#bar').addEventListener('focus',e=>e.target.select());
$('#bar').addEventListener('blur',()=>setTimeout(()=>{if(!newPending)$('#bar').placeholder='Search or enter address';if(panel=='suggest'&&document.activeElement!==$('#bar'))closePanel();draw()},150));
async function renderSuggest(keep){
  const q=$('#bar').value.trim();if(!q)return;
  if(!keep){const looksUrl=/^\S+\.\S+$/.test(q)||/^https?:/.test(q);
    sugItems=[{kind:'go',title:looksUrl?'Go to '+q:'Search for “'+q+'”',url:q,icon:looksUrl?'→':'⌕'}];
    const lq=q.toLowerCase();tabs.filter(t=>t.url.toLowerCase().includes(lq)).slice(0,3).forEach(t=>sugItems.push({kind:'tab',title:hostOf(t.url),url:t.url,id:t.id,icon:'⇥',note:'Switch to tab'}));
    try{(await inv('suggest',{q})).forEach(x=>sugItems.push({kind:'url',title:x.title||hostOf(x.url),url:x.url,icon:x.kind=='bookmark'?'★':'↺',note:x.kind=='bookmark'?'Bookmark':'History'}))}catch(e){}
    sugSel=0;if($('#bar').value.trim()!==q||panel!='suggest')return}
  $('#panel').innerHTML=`<div class=res>${sugItems.map((x,i)=>`<button data-i=${i} class="${i==sugSel?'sel':''}"><i>${esc(x.icon||'•')}</i><span>${esc(x.title)}</span><small>${esc(x.note||'')}</small></button>`).join('')}</div>`;
  $('#panel').querySelectorAll('[data-i]').forEach(b=>b.onmousedown=e=>{e.preventDefault();runItem(sugItems[b.dataset.i])});
}
function runItem(x){if(x.kind=='go')go(x.url);else if(x.kind=='tab')select(x.id);else if(x.kind=='url')go(x.url);else if(x.run)x.run()}

$('#new').onclick=()=>newTab(false);$('#new').oncontextmenu=e=>{e.preventDefault();newTab(true)};$('#new').title='New tab (Ctrl+T) · Right-click: private tab (Ctrl+Shift+N)';
$('#ws').onclick=()=>openPanel('ws');

// Mouse wheel / two-finger swipe over the tab bar flips through tabs.
let wheelAcc=0,wheelT;$('#tabsbar').addEventListener('wheel',e=>{if(e.target.closest('#tabs')&&$('#tabs').scrollHeight>$('#tabs').clientHeight+4)return;
  e.preventDefault();wheelAcc+=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;clearTimeout(wheelT);wheelT=setTimeout(()=>wheelAcc=0,200);

// ---------- find in page ----------
function findMode(on){findOn=on;$('#pill').classList.toggle('finding',on);if(on){$('#findq').value='';$('#findn').textContent='';$('#findq').focus()}else{inv('page_action',{action:'find-clear'}).catch(()=>{});draw()}}
$('#findq').addEventListener('keydown',e=>{if(e.key=='Escape'){e.preventDefault();findMode(false)}
  else if(e.key=='Enter'){const q=e.target.value;if(q)inv('page_action',{action:e.shiftKey?'find-back':'find',arg:q});$('#findn').textContent=e.shiftKey?'↑':'↓'}});

// ---------- shortcuts (chrome focused: keydown; page focused: native 'shortcut' event from Rust) ----------
function shortcut(k){
  if(k=='t')newTab(false); else if(k=='shift+n')newTab(true); else if(k=='l'){closePanel();$('#bar').focus()} else if(k=='w'){cur&&closeTab(cur)}
  else if(k=='d')$('#star').click(); else if(k=='j')$('#dls').click(); else if(k==',')$('#gear').click();
  else if(k=='k')panel=='pal'?closePanel():openPanel('pal'); else if(k=='h')panel=='history'?closePanel():openPanel('history');
  else if(k=='f'){if(tab(cur))findMode(true)} else if(k=='e'){if(tab(cur))inv('page_action',{action:'reader'})}
  else if(k=='p'){if(tab(cur))inv('page_action',{action:'print'})}
  else if(k=='\\'){const o=inWs().filter(t=>t.id!=cur).at(-1);if(split)toggleSplit(split);else if(o)toggleSplit(o.id)}
  else if(k=='tab')cycle(1); else if(k=='shift+tab')cycle(-1);
  else if(k=='b'){if(pref('tabs_mode')!='auto'){toast('Tab bar is pinned — change it in Settings');return}revealed?reveal(false):peek()}
}
addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(m&&e.key=='Tab'){e.preventDefault();shortcut(e.shiftKey?'shift+tab':'tab')}
  else if(m&&e.shiftKey&&k=='n'){e.preventDefault();shortcut('shift+n')}
  else if(m&&['t','l','w','d','j','b',',','k','h','f','e','p','\\'].includes(k)){e.preventDefault();shortcut(k)}
  else if(m&&k=='r'){e.preventDefault();cur&&inv('nav',{action:'reload'})}
  else if(e.key=='Escape'&&panel)closePanel();
  else if(e.altKey&&e.key=='ArrowLeft')inv('nav',{action:'back'});
  else if(e.altKey&&e.key=='ArrowRight')inv('nav',{action:'fwd'});});
T.event.listen('shortcut',({payload:p})=>shortcut(p.key));

// ---------- events from Rust ----------
T.event.listen('tab-url',({payload:p})=>{const t=tab(p.tab);if(!t)return;t.url=p.url;
  if(p.state=='finished'){if(!t.priv)inv('history_add',{url:p.url,title:hostOf(p.url).replace(/^www\./,'')}).catch(()=>{});saveSession()}
  if(p.tab==cur)$('#load').classList.toggle('on',p.state=='started');draw()});
T.event.listen('focus-blocked',({payload:p})=>{if(p.tab==cur){$('#load').classList.remove('on');toast('Focus mode: '+hostOf(p.url).replace(/^www\./,'')+' is paused — Ctrl+K → Focus mode to end')}});
// Memory saver: background tabs you haven't opened for a while are closed in the background and reload when you click them.
setInterval(async()=>{const m=+pref('memory_saver');if(!m)return;const cutoff=Date.now()-m*60000;
  for(const t of tabs)if(t.id!=cur&&t.id!=split&&!t.sleeping&&(t.last||Date.now())<cutoff&&t.url){t.sleeping=true;await inv('close_tab',{label:t.id}).catch(()=>{});draw()}},60000);
T.event.listen('blocked',({payload:p})=>{counts[p.tab]=p.count;if(p.tab==cur)draw()});
T.event.listen('https-failed',({payload:p})=>{if(p.tab==cur){$('#load').classList.remove('on');toast(hostOf(p.url)+' has no secure version')}});
T.event.listen('download',({payload:p})=>{
  if(p.state=='started'){downloads.unshift({url:p.url,name:p.name||'download',path:p.path,state:'started'});toast('Downloading '+(p.name||'file')+'…')}
  else{const d=downloads.find(d=>d.url==p.url&&d.state=='started');if(d){d.state=p.state;if(p.path)d.path=p.path}
    toast(p.state=='done'?'Downloaded '+(d?.name||'file')+' · Ctrl+J':'Download failed')}
  draw();if(panel=='downloads')renderDownloads()});

const RENDER={reading:()=>renderReading(),focus:()=>renderFocus(),about:()=>renderAbout(),send:()=>renderSend(),settings:()=>renderSettings(),downloads:()=>renderDownloads(),suggest:()=>renderSuggest(),pal:()=>renderPalette(),
  history:()=>renderHistory(),site:()=>renderSite(),ws:()=>renderWs()};

const closeBtn='<button class=btn data-close>Done</button>';

// Command palette (Ctrl+K): actions, tabs, workspaces, bookmarks, history — type to filter, Enter to run.
const ACTIONS=()=>[
  ['New tab','Ctrl+T',()=>newTab(false)],['New private tab','Ctrl+Shift+N',()=>newTab(true)],
  ['Find in page','Ctrl+F',()=>{closePanel();tab(cur)&&findMode(true)}],['Reader view','Ctrl+E',()=>{closePanel();tab(cur)&&inv('page_action',{action:'reader'})}],
  ['Split view with last tab','Ctrl+\\',()=>{closePanel();shortcut('\\')}],['Site settings & QR code','',()=>tab(cur)&&openPanel('site')],
  ['Toggle dark mode for websites','',async()=>{await setPref('force_dark',pref('force_dark')=='true'?'false':'true');applyDarkNow();closePanel()}],
  ['Read later','',async()=>{const t=tab(cur);if(!t)return;await inv('bookmark_add',{title:hostOf(t.url),url:t.url,folder:'reading'});await loadState();closePanel();toast('Added to reading list')}],
  ['Reading list','',()=>openPanel('reading')],['Save page as PDF / print','Ctrl+P',()=>{closePanel();tab(cur)&&inv('page_action',{action:'print'})}],
  ['Focus mode','',()=>openPanel('focus')],['Send bookmarks to phone','',()=>openPanel('send')],['About Hush & updates','',()=>openPanel('about')],
  ['History','Ctrl+H',()=>openPanel('history')],['Downloads','Ctrl+J',()=>openPanel('downloads')],['Settings','Ctrl+,',()=>openPanel('settings')],
  ['New workspace…','',()=>openPanel('ws')],['Close tab','Ctrl+W',()=>{closePanel();cur&&closeTab(cur)}],['Clear browsing data','',()=>{closePanel();$('#s-wipe')?.click()||wipe()}],
  ...wsList().filter(w=>w!=curWs()).map(w=>['Switch to workspace: '+w,'',()=>{closePanel();switchWs(w)}]),
];
let palSel=0,palItems=[];
function renderPalette(){
  const p=$('#panel');p.innerHTML=`<input id=palq placeholder="Type a command, tab, or site…" autocomplete=off spellcheck=false><div class=res id=palr></div>`;
  const q=$('#palq');q.focus();q.oninput=()=>{palSel=0;fillPalette(q.value)};
  q.onkeydown=e=>{if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();palSel=(palSel+(e.key=='ArrowDown'?1:-1)+palItems.length)%palItems.length;paintPalette()}
    else if(e.key=='Enter'&&palItems[palSel]){e.preventDefault();runItem(palItems[palSel])}else if(e.key=='Escape')closePanel()};
  fillPalette('');
}
async function fillPalette(q){const lq=q.toLowerCase().trim(),m=s=>!lq||s.toLowerCase().includes(lq);
  let items=ACTIONS().filter(a=>m(a[0])).map(a=>({kind:'run',title:a[0],note:a[1],icon:'›',run:a[2]}));
  tabs.filter(t=>m(t.url)).forEach(t=>items.push({kind:'tab',id:t.id,title:hostOf(t.url)||'New tab',note:(t.ws!=curWs()?t.ws+' · ':'')+'Tab',icon:'⇥'}));
  if(lq){try{(await inv('suggest',{q:lq})).forEach(x=>items.push({kind:'url',url:x.url,title:x.title||hostOf(x.url),note:x.kind=='bookmark'?'Bookmark':'History',icon:x.kind=='bookmark'?'★':'↺'}))}catch(e){}
    items.push({kind:'go',url:q,title:(/^\S+\.\S+$/.test(q)?'Go to ':'Search for ')+q,icon:'→'})}
  if(($('#palq')?.value||'').toLowerCase().trim()!==lq)return;palItems=items.slice(0,14);paintPalette()}
function paintPalette(){const r=$('#palr');if(!r)return;
  r.innerHTML=palItems.map((x,i)=>`<button data-i=${i} class="${i==palSel?'sel':''}"><i>${esc(x.icon)}</i><span>${esc(x.title)}</span><small>${esc(x.note||'')}</small></button>`).join('');
  r.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>runItem(palItems[b.dataset.i]))}

function renderWs(){const p=$('#panel');
  p.innerHTML=`<h2>Workspaces ${closeBtn}</h2><p style="color:var(--mute);margin:-8px 0 14px">Separate sets of tabs — like “Work” and “Personal”.</p>
  ${wsList().map(w=>`<div class=row><div><b>${esc(w)}</b><small>${tabs.filter(t=>t.ws==w).length} tabs${w==curWs()?' · current':''}</small></div>
    <div class=acts style="display:flex;gap:6px">${w!=curWs()?`<button class=btn data-go="${esc(w)}">Switch</button>`:''}${wsList().length>1?`<button class=btn data-rm="${esc(w)}">Remove</button>`:''}</div></div>`).join('')}
  <div class=row><input class=txt id=wsname placeholder="New workspace name" style="margin:0"><button class=btn id=wsadd>Add</button></div>`;
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closePanel();switchWs(b.dataset.go)});
  p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('Remove “'+b.dataset.rm+'” and close its tabs?')){await removeWs(b.dataset.rm);renderWs()}});
  $('#wsadd').onclick=async()=>{await addWs($('#wsname').value);closePanel()};$('#wsname').onkeydown=e=>{if(e.key=='Enter')$('#wsadd').click()};wire(p)}

async function renderHistory(){const p=$('#panel'),on=pref('history')=='on';
  const list=on?await inv('history_list',{limit:300}).catch(()=>[]):[];
  p.innerHTML=`<h2>History ${closeBtn}</h2>
  ${row('Remember history','Off by default. Kept only on this computer; private tabs are never recorded.',`<button class="sw ${on?'on':''}" id=h-on></button>`)}
  ${on?`<input class=txt id=h-q placeholder="Search history" style="margin:6px 0 10px"><div id=h-list></div><div style="margin-top:14px"><button class=btn id=h-clear>Clear all history</button></div>`:''}`;
  const paint=q=>{const box=$('#h-list');if(!box)return;const lq=(q||'').toLowerCase();let day='';
    box.innerHTML=list.filter(h=>!lq||(h.url+h.title).toLowerCase().includes(lq)).slice(0,200).map(h=>{const d=new Date(h.t*1000).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
      const hd=d!=day?`<h3>${esc(day=d)}</h3>`:'';return hd+`<div class=row style="cursor:pointer" data-u="${esc(h.url)}"><div><b>${esc(h.title||hostOf(h.url))}</b><small>${esc(h.url)}</small></div><small>${new Date(h.t*1000).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</small></div>`}).join('')||'<div class=empty>Nothing yet.</div>';
    box.querySelectorAll('[data-u]').forEach(r=>r.onclick=()=>go(r.dataset.u))};
  paint('');if($('#h-q'))$('#h-q').oninput=e=>paint(e.target.value);
  $('#h-on').onclick=async()=>{await setPref('history',on?'off':'on');renderHistory()};
  if($('#h-clear'))$('#h-clear').onclick=async()=>{if(confirm('Clear all history?')){await inv('history_clear');renderHistory()}};wire(p)}

function renderReading(){const p=$('#panel'),list=state.bookmarks.filter(b=>b.folder=='reading');
  p.innerHTML=`<h2>Reading list ${closeBtn}</h2>`+(list.length?list.map(b=>`<div class=row><div style="cursor:pointer;flex:1" data-u="${esc(b.url)}"><b>${esc(b.title||hostOf(b.url))}</b><small>${esc(b.url)}</small></div><button class=btn data-rm="${esc(b.url)}">Done</button></div>`).join('')
    :'<div class=empty>Nothing saved yet. Ctrl+K → “Read later” adds the page you’re on.<br>Ctrl+P saves a page as PDF for offline reading.</div>');
  p.querySelectorAll('[data-u]').forEach(r=>r.onclick=()=>openTab(r.dataset.u));
  p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{await inv('bookmark_remove',{url:b.dataset.rm});await loadState();renderReading()});wire(p)}
function focusLeft(){return Math.max(0,+pref('focus_until')-Date.now()/1000)}
function renderFocus(){const p=$('#panel'),left=focusLeft(),sites=pref('focus_sites').split(',').map(x=>x.trim()).filter(Boolean);
  p.innerHTML=`<h2>Focus mode ${closeBtn}</h2>`+(left>0?row('Focus is on',Math.ceil(left/60)+' minutes left · '+sites.length+' sites paused','<button class=btn id=f-end>End now</button>')
    :`<p style="color:var(--mute);margin:-8px 0 12px">Pause distracting sites for a while. Links to them simply won’t open until focus ends.</p><div class=chips>${[25,50,90,180].map(m=>`<button data-min=${m}>${m<60?m+' min':m/60+' h'}</button>`).join('')}</div>`)+
    `<h3>Paused sites</h3>${sites.map(x=>row(esc(x),'',`<button class=btn data-rm="${esc(x)}">Remove</button>`)).join('')}<div class=row><input class=txt id=f-add placeholder="Add a site, e.g. news.com" style="margin:0"><button class=btn id=f-addb>Add</button></div>`;
  p.querySelectorAll('[data-min]').forEach(b=>b.onclick=async()=>{await setPref('focus_until',String(Math.floor(Date.now()/1000)+ +b.dataset.min*60));toast('Focus on for '+b.textContent);renderFocus()});
  if($('#f-end'))$('#f-end').onclick=async()=>{await setPref('focus_until','0');renderFocus()};
  p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{await setPref('focus_sites',sites.filter(x=>x!=b.dataset.rm).join(','));renderFocus()});
  $('#f-addb').onclick=async()=>{const v=hostOf('https://'+$('#f-add').value.trim().replace(/^https?:\/\//,'')).replace(/^www\./,'');if(v&&!sites.includes(v)){await setPref('focus_sites',[...sites,v].join(','));renderFocus()}};wire(p)}
// Bookmarks -> phone: a hush:// link in a QR code. The phone's camera opens it in Hush, which asks before importing.
function renderSend(){const p=$('#panel'),all=state.bookmarks.filter(b=>/^https?:/.test(b.url));let n=all.length,link='';
  const mk=k=>'hush://import#'+btoa(unescape(encodeURIComponent(JSON.stringify({b:all.slice(0,k).map(b=>[b.title.slice(0,40),b.url,b.folder||''])})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  while(n>0&&(link=mk(n)).length>2200)n--;
  p.innerHTML=`<h2>Send to phone ${closeBtn}</h2>`+(n?`<p style="color:var(--mute);margin:-8px 0 14px">Point your phone’s camera at this code and tap the link — Hush on your phone asks before adding ${n} bookmark${n>1?'s':''}${n<all.length?` (the first ${n} of ${all.length} fit in one code)`:''}.</p>
    <div class=qr style="width:260px;height:260px">${hushQR.svg(link)}</div>`:'<div class=empty>No bookmarks to send yet.</div>');wire(p)}
async function renderAbout(){const p=$('#panel');let info={build:'dev',platform:''};try{info=await inv('app_info')}catch(e){}
  p.innerHTML=`<h2>About Hush ${closeBtn}</h2><div style="text-align:center;margin-bottom:14px"><div style="font:300 48px/1 ui-serif,'Times New Roman',Georgia,serif">hush.</div><small style="color:var(--mute)">Build ${esc(info.build)} · ${esc(info.platform)}</small></div>
  ${row('Updates','<span id=a-up>Check GitHub for a newer build</span>','<button class=btn id=a-chk>Check</button>')}
  <h3>Privacy policy</h3><div class=row style="display:block;line-height:1.6">Hush collects nothing. No accounts, no analytics, no crash reports, no Hush servers. Bookmarks, settings and (if you turn it on) history stay on this computer.
   Hush only connects to the sites you visit and — when you ask — to the filter-list sites (easylist.to, fanboy.co.nz, ublockorigin.github.io) and GitHub for updates.</div>
  <h3>Open-source licenses</h3><div class=row style="display:block;line-height:1.8;font-size:12px">Hush is free software under the <b>GNU GPL v3</b> (see LICENSE).<br>uBlock Origin scriptlets & filter lists — GPL v3, © Raymond Hill & contributors<br>adblock-rust — MPL 2.0, © Brave Software<br>
   EasyList, EasyPrivacy — GPL v3 / CC BY-SA 3.0<br>Fanboy’s Cookie List — © Fanboy<br>Tauri, wry, tao, webview2-com, windows-rs — MIT / Apache 2.0<br>QR code generator after Project Nayuki — MIT</div>`;
  $('#a-chk').onclick=async()=>{$('#a-up').textContent='Checking…';try{const u=await inv('check_update');$('#a-up').textContent=u.newer?`Build ${u.latest} is available — run “git pull” in C:\\dev\\hush, then rebuild`:`You’re up to date (latest: ${u.latest})`}
    catch(e){$('#a-up').textContent=String(e).includes('private')?'Your GitHub repo is private, so Hush can’t see releases — run “git pull” to update':'Couldn’t check right now'}};wire(p)}
function siteDark(h){const v=state.site_dark?.[h];return v===true?'on':v===false?'off':'auto'}
function applyDarkNow(){const t=tab(cur);if(!t)return;const h=hostOf(t.url),sd=siteDark(h),on=sd=='auto'?pref('force_dark')=='true':sd=='on';
  inv('page_action',{action:on?'dark-on':'dark-off'}).catch(()=>{})}
function renderSite(){const t=tab(cur),p=$('#panel');if(!t)return closePanel();const h=hostOf(t.url),off=allow.has(h),sd=siteDark(h);
  p.innerHTML=`<h2>${esc(h.replace(/^www\./,''))} ${closeBtn}</h2>
  ${row('Shield',off?'Off — ads and trackers are allowed here':`On — ${counts[cur]||0} blocked on this page`,`<button class="sw ${off?'':'on'}" id=st-shield></button>`)}
  ${row('Dark mode on this site','Auto follows your setting in Settings',`<div class=seg>${[['auto','Auto'],['on','On'],['off','Off']].map(([v,l])=>`<button data-d=${v} class="${sd==v?'on':''}">${l}</button>`).join('')}</div>`)}
  ${t.priv?row('Private tab','Nothing from this tab is saved',''):''}
  <h3>Page</h3>
  <div class=chips><button id=st-read>Reader view</button><button id=st-find>Find in page</button><button id=st-pick>Block an element</button>
   <button id=st-copy>Copy link</button><button id=st-split>${split?'Close split view':'Split with another tab'}</button></div>
  <h3>Open on your phone</h3><div class=qr>${(()=>{try{return hushQR.svg(t.url)}catch(e){return ''}})()}</div>
  <p style="color:var(--mute);text-align:center;font-size:12px;margin-top:8px">Scan with your phone’s camera</p>`;
  $('#st-shield').onclick=async()=>{await inv('toggle_shield',{host:h});off?allow.delete(h):allow.add(h);inv('nav',{action:'reload'});renderSite();draw()};
  p.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const v=b.dataset.d;await inv('site_dark',{host:h,value:v=='auto'?null:v=='on'});
    state.site_dark=state.site_dark||{};if(v=='auto')delete state.site_dark[h];else state.site_dark[h]=v=='on';applyDarkNow();renderSite()});
  $('#st-read').onclick=()=>{closePanel();inv('page_action',{action:'reader'})};$('#st-find').onclick=()=>{closePanel();findMode(true)};
  $('#st-pick').onclick=()=>{closePanel();$('#pick').click()};$('#st-copy').onclick=async()=>{try{await navigator.clipboard.writeText(t.url);toast('Link copied')}catch(e){toast('Couldn’t copy')}};
  $('#st-split').onclick=()=>{closePanel();shortcut('\\')};wire(p)}

const seg=(k,opts)=>`<div class=seg>${opts.map(([v,l])=>`<button data-k=${k} data-v="${v}" class="${pref(k)==v?'on':''}">${l}</button>`).join('')}</div>`;
const row=(title,sub,ctl)=>`<div class=row><div>${title}${sub?`<small>${sub}</small>`:''}</div>${ctl}</div>`;
const sw=(k,on)=>`<button class="sw ${on?'on':''}" data-sw=${k}></button>`;
function wipe(){if(confirm('Clear all cookies, cache and site data?')){inv('clear_data');toast('Browsing data cleared')}}
function renderSettings(){
  const s=state.settings, p=$('#panel'), auto=pref('tabs_mode')=='auto';
  p.innerHTML=`<h2>Settings ${closeBtn}</h2>
  <h3>Layout</h3>
  ${row('Tab bar position','',seg('tabs_pos',[['left','Left'],['right','Right'],['top','Top'],['bottom','Bottom']]))}
  ${row('Tab bar','Auto-hide slides it away; move the mouse to that edge or press <kbd>Ctrl</kbd>+<kbd>B</kbd> to bring it back',seg('tabs_mode',[['auto','Auto-hide'],['pinned','Always shown']]))}
  ${auto?row('Hide after','How long the tab bar stays after the mouse leaves',seg('hide_delay',[['1','1s'],['2','2s'],['3','3s'],['5','5s'],['10','10s']])):''}
  ${row('Address bar','',seg('bar_pos',[['top','Top'],['bottom','Bottom']]))}
  ${row('Density','',seg('density',[['normal','Comfortable'],['compact','Compact']]))}
  <h3>Appearance</h3>
  ${row('Theme','',seg('theme',[['system','System'],['light','Light'],['dark','Dark']]))}
  ${row('Browser color','Tints the whole browser',`<div class=swatches>${Object.entries(COLORS).map(([k,v])=>`<button data-color=${k} title=${k} class="${pref('color')==k?'on':''}" style="background:${v?`hsl(${v[0]} ${v[1]}% 55%)`:'#555'}"></button>`).join('')}
    <label class=btn style="position:relative;overflow:hidden;height:26px;padding:0 10px">Custom<input type=color id=s-color value="${/^#/.test(pref('color'))?pref('color'):'#3b82f6'}" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div>`)}
  ${row('Dark mode for websites','Darkens light sites. Change it per site from the shield.',sw('force_dark',pref('force_dark')=='true'))}
  <h3>Tabs & history</h3>
  ${row('Reopen tabs on start','Restores your tabs and workspaces next time (private tabs never)',sw('restore',pref('restore')=='on'))}
  ${row('Remember history','Off by default · kept only on this computer · <a href="#" id=s-hist>open history</a>',sw('history',pref('history')=='on'))}
  ${row('Workspaces',esc(wsList().join(' · ')),'<button class=btn id=s-ws>Manage</button>')}
  ${row('Memory saver','Background tabs you haven’t used for a while are put to sleep',seg('memory_saver',[['0','Off'],['15','15 min'],['30','30 min'],['120','2 h']]))}
  ${row('Reading list',state.bookmarks.filter(b=>b.folder=='reading').length+' saved','<button class=btn id=s-rl>Open</button>')}
  ${row('Focus mode','Pause distracting sites for a while','<button class=btn id=s-focus>Set up</button>')}
  <h3>Search</h3>
  ${row('Search engine',s.search=='custom'?'Use %s where the search words go':'',`<select id=s-engine>${[['duckduckgo','DuckDuckGo'],['brave','Brave'],['startpage','Startpage'],['ecosia','Ecosia'],['custom','Custom…']]
      .map(([v,l])=>`<option value=${v} ${s.search==v?'selected':''}>${l}</option>`).join('')}</select>`)}
  ${s.search=='custom'?`<input class=txt id=s-custom placeholder="https://example.com/search?q=%s" value="${esc(s.custom_search)}">`:''}
  ${row('Search shortcuts','<kbd>!w</kbd> Wikipedia · <kbd>!yt</kbd> YouTube · <kbd>!a</kbd> Amazon · <kbd>!gh</kbd> GitHub · <kbd>!r</kbd> Reddit · <kbd>!m</kbd> maps · <kbd>!i</kbd> images'+(pref('bangs')?' · yours: '+esc(pref('bangs').split('|').map(x=>'!'+x.split('=')[0]).join(' ')):''),'<button class=btn id=s-bangs>Edit mine</button>')}
  <h3>Privacy</h3>
  ${row('Blocked counter','Badge on the shield showing what was blocked on this page',`<button class="sw ${s.counter!==false?'on':''}" id=s-counter aria-label="Blocked counter"></button>`)}
  ${row('Filter lists','Ads, trackers and cookie banners — download the latest',`<button class=btn id=s-lists>Update now</button>`)}
  ${row('Browsing data','Cookies, cache and site storage for every site',`<button class=btn id=s-wipe>Clear…</button>`)}
  ${row('Shield exceptions',allow.size?'':'Sites where you turned the shield off',allow.size?'':'<span class=state>None</span>')}
  ${[...allow].map(h=>row(esc(h),'',`<button class=btn data-allow="${esc(h)}">Turn shield on</button>`)).join('')}
  <h3>Your data</h3>
  ${row('Send to your phone','Show a QR code your phone’s camera can scan to copy your bookmarks','<button class=btn id=s-send>Show QR</button>')}
  ${row('About Hush','Version, updates, privacy policy and licenses','<button class=btn id=s-about>Open</button>')}
  ${row('Export','Settings, bookmarks, filters and exceptions as JSON (copied to clipboard)',`<button class=btn id=s-export>Copy</button>`)}
  ${row('Import','Paste an export below, then press Import',`<button class=btn id=s-import>Import</button>`)}
  <textarea class=txt id=s-json rows=3 style="width:100%;font:12px ui-monospace,monospace" placeholder='{"settings":…}'></textarea>
  <h3>Shortcuts & gestures</h3>
  <div class=row style="display:block;line-height:2.1"><kbd>Ctrl</kbd>+<kbd>K</kbd> command bar · <kbd>Ctrl</kbd>+<kbd>T</kbd> new tab · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> private tab · <kbd>Ctrl</kbd>+<kbd>W</kbd> close ·
   <kbd>Ctrl</kbd>+<kbd>Tab</kbd> next tab · <kbd>Ctrl</kbd>+<kbd>L</kbd> address · <kbd>Ctrl</kbd>+<kbd>F</kbd> find · <kbd>Ctrl</kbd>+<kbd>E</kbd> reader ·
   <kbd>Ctrl</kbd>+<kbd>\\</kbd> split view · <kbd>Ctrl</kbd>+<kbd>B</kbd> show/hide tabs · <kbd>Ctrl</kbd>+<kbd>D</kbd> bookmark · <kbd>Ctrl</kbd>+<kbd>H</kbd> history · <kbd>Ctrl</kbd>+<kbd>J</kbd> downloads · <kbd>Ctrl</kbd>+<kbd>,</kbd> settings<br>
   Scroll or two-finger swipe over the tab bar to flip tabs · drag tabs to reorder · shift-click or right-click a tab to split · middle-click to close · right-click ＋ for a private tab</div>`;
  p.querySelectorAll('.seg button').forEach(b=>b.onclick=async()=>{await setPref(b.dataset.k,b.dataset.v);draw();renderSettings()});
  p.querySelectorAll('[data-color]').forEach(b=>b.onclick=async()=>{await setPref('color',b.dataset.color);renderSettings()});
  $('#s-color').oninput=e=>{state.settings.ui.color=e.target.value;applyColor()};$('#s-color').onchange=async e=>{await setPref('color',e.target.value);renderSettings()};
  p.querySelectorAll('[data-sw]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,on=b.classList.contains('on');
    await setPref(k,k=='force_dark'?String(!on):(on?'off':'on'));if(k=='force_dark')applyDarkNow();if(k=='restore')saveSession();renderSettings()});
  $('#s-hist').onclick=e=>{e.preventDefault();openPanel('history')};
  $('#s-rl').onclick=()=>openPanel('reading');$('#s-focus').onclick=()=>openPanel('focus');$('#s-send').onclick=()=>openPanel('send');$('#s-about').onclick=()=>openPanel('about');
  $('#s-bangs').onclick=async()=>{const v=prompt('Your shortcuts, separated by | as  key=https://site.com/search?q=%s',pref('bangs'));if(v===null)return;
    const list=v.split(/\||\n/).map(x=>x.trim()).filter(x=>/^[a-z0-9]{1,12}=https:\/\/\S+$/i.test(x));await setPref('bangs',list.join('|'));renderSettings();toast(list.length+' shortcuts saved')};$('#s-ws').onclick=()=>openPanel('ws');
  $('#s-engine').onchange=async e=>{s.search=e.target.value;await inv('set_setting',{key:'search',value:s.search});renderSettings()};
  const cs=$('#s-custom');if(cs)cs.onchange=async()=>{const v=cs.value.trim();if(!v.startsWith('https://')||!v.includes('%s')){toast('Must start with https:// and contain %s');return}
    s.custom_search=v;await inv('set_setting',{key:'custom_search',value:v});toast('Saved')};
  $('#s-counter').onclick=async()=>{s.counter=s.counter===false;await inv('set_setting',{key:'counter',value:String(s.counter)});renderSettings();draw()};
  $('#s-lists').onclick=async e=>{e.target.textContent='Updating…';try{toast(await inv('update_lists'))}catch(err){toast(String(err))}renderSettings()};
  $('#s-wipe').onclick=wipe;
  p.querySelectorAll('[data-allow]').forEach(b=>b.onclick=async()=>{await inv('toggle_shield',{host:b.dataset.allow});allow.delete(b.dataset.allow);renderSettings();draw()});
  $('#s-export').onclick=async()=>{try{await navigator.clipboard.writeText(await inv('export_data'));toast('Copied to clipboard')}catch(e){toast(String(e))}};
  $('#s-import').onclick=async()=>{try{await inv('import_data',{json:$('#s-json').value});await loadState();renderSettings();toast('Imported')}catch(e){toast(String(e))}};
  wire(p);
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':n.toLocaleString();
async function loadStats(){clearTimeout(statsT);try{const s=await inv('get_stats');
  $('#stats').innerHTML=s.total?`<b>${fmt(s.week)}</b> ads & trackers blocked this week · <b>${fmt(s.total)}</b> all time`:'Ads, trackers and cookie banners are blocked automatically.'}catch(e){}
  statsT=setTimeout(()=>{if($('#home').style.display!='none')loadStats()},15000)}

async function loadState(first){try{state=await inv('get_state');state.settings.ui=state.settings.ui||{};allow=new Set(state.allow_sites);
  const box=$('#bms');box.textContent='';
  state.bookmarks.filter(b=>b.folder!='reading').slice(0,12).forEach(b=>{const a=document.createElement('button');a.className='bm';const h=hostOf(b.url).replace(/^www\./,'');
    a.innerHTML='<i></i><span></span>';a.querySelector('i').textContent=h[0]||'•';a.querySelector('span').textContent=b.title||h;a.title=b.url+'\nRight-click to remove';
    a.onclick=()=>openTab(b.url);a.oncontextmenu=async e=>{e.preventDefault();if(confirm('Remove bookmark '+(b.title||h)+'?')){await inv('bookmark_remove',{url:b.url});loadState()}};box.append(a)});
  layout(true);draw();
  if(first&&pref('restore')=='on'&&state.session?.length&&!tabs.length){for(const t of state.session)await openTab(t.url,{ws:wsList().includes(t.ws)?t.ws:curWs(),quiet:true,background:true});
    const last=inWs().at(-1);if(last)select(last.id);toast('Restored '+state.session.length+' tabs')}
}catch(e){console.error(e)}}
layout(true);draw();loadState(true);$('#bar').focus();
</script>

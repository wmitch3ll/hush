<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Hush</title>
<style>
/* Grayscale tokens — same names as mobile.html. Light / dark (system) / forced via [data-theme]. */
:root{--bg:#f5f5f4;--card:#fff;--line:#e4e4e2;--ink:#161616;--mute:#8b8b88;--acc:#161616;--glow:#16161622;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f0f;--card:#1a1a1a;--line:#262626;--ink:#ececec;--mute:#777;--acc:#ececec;--glow:#ececec22;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f0f0f;--card:#1a1a1a;--line:#262626;--ink:#ececec;--mute:#777;--acc:#ececec;--glow:#ececec22;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden;user-select:none}
button{all:unset;cursor:pointer;color:var(--mute);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;position:relative;flex:none}
button:hover{background:var(--card);color:var(--ink)}button:focus-visible{box-shadow:0 0 0 2px var(--glow)}
button:disabled{opacity:.3;pointer-events:none}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#tabsbar{display:none!important}
/* Positions/sizes of #addr, #tabsbar, #page are set by layout() in JS — one source of truth, also sent to Rust. */
#np{display:none;align-items:center;gap:2px;height:30px;padding:0 4px 0 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:600 11.5px system-ui;max-width:220px;flex:none}#np.on{display:flex}#np span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}#np button{width:26px;height:26px}
#addr{position:absolute;display:flex;gap:4px;align-items:center;padding:0 10px;background:var(--bg);z-index:3}
#addr.top{border-bottom:1px solid var(--line)}#addr.bottom{border-top:1px solid var(--line)}
#tabsbar{position:absolute;display:flex;align-items:center;gap:8px;background:var(--bg);z-index:2;transition:transform .18s ease}
#tabsbar.v{flex-direction:column;padding:10px 0}#tabsbar.h{flex-direction:row;padding:0 8px}
#tabsbar.left{border-right:1px solid var(--line)}#tabsbar.right{border-left:1px solid var(--line)}
#tabsbar.top{border-bottom:1px solid var(--line)}#tabsbar.bottom{border-top:1px solid var(--line)}
#tabsbar.hidden>*{opacity:0;pointer-events:none}
#tabsbar.hidden::after{content:"";position:absolute;background:var(--line);border-radius:2px}
#tabsbar.hidden.left::after{right:2px;top:50%;width:2px;height:40px;margin-top:-20px}
#tabsbar.hidden.right::after{left:2px;top:50%;width:2px;height:40px;margin-top:-20px}
#tabsbar.hidden.top::after{bottom:2px;left:50%;height:2px;width:40px;margin-left:-20px}
#tabsbar.hidden.bottom::after{top:2px;left:50%;height:2px;width:40px;margin-left:-20px}
#tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;min-width:0;min-height:0}
#tabsbar.v #tabs{flex-direction:column}
.tab{flex:none;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer;color:var(--mute);transition:.12s;overflow:hidden;white-space:nowrap}
#tabsbar.v .tab{width:38px;text-transform:uppercase}
#tabsbar.h .tab{height:28px;max-width:180px;padding:0 10px;font-weight:500}
#tabsbar.h .tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink)}.tab.on{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 3px var(--glow)}
.compact .tab{height:32px}.compact #tabsbar.v .tab{width:32px}.compact #tabsbar.h .tab{height:24px}

body.tor #pill{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf622}#torb{display:none;font:600 10.5px system-ui;color:#fff;background:#7c3aed;border-radius:99px;padding:3px 8px;white-space:nowrap;flex:none}body.tor #torb{display:inline-block}
#onion.on{color:#7c3aed}#newid{display:none}body.tor #newid{display:grid;color:#7c3aed}
#pill{flex:1;display:flex;align-items:center;gap:6px;height:34px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 4px 0 12px;margin:0 6px;transition:border-color .15s,box-shadow .15s;min-width:0}
.compact #pill{height:30px}
#pill:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
#lock{width:12px;height:12px;color:var(--mute);flex:none}
#bar{all:unset;flex:1;color:var(--ink);font-size:13.5px;user-select:text;min-width:0}
#bar::placeholder{color:var(--mute)}
.badge{position:absolute;top:2px;right:0;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;display:none;place-items:center}
#shield.off{opacity:.4}#shield.off .badge{display:none!important}
#load{position:absolute;left:0;right:0;height:2px;background:var(--acc);transform-origin:left;transform:scaleX(0);opacity:0;transition:transform .4s,opacity .3s;z-index:4}
#load.on{opacity:1;transform:scaleX(.7);transition:transform 6s cubic-bezier(.1,.6,.2,1)}

#page{position:absolute;overflow:auto}
#home{height:100%;display:grid;place-content:center;justify-items:center;text-align:center;gap:26px}
#home h1{font:300 66px/1 ui-serif,"Times New Roman",Times,Georgia,serif;letter-spacing:-2px;margin-bottom:6px}#home p{color:var(--mute);margin-top:-18px}
#bms{display:none}
#home{display:block!important;overflow:auto}#home .hx-home h1{margin:0}#home .hx-home p{margin:0}#home[hidden]{display:none!important}
#lctl{display:none;gap:2px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 4px;height:32px}#lctl.on{display:flex}#lctl b{font:600 11px system-ui;color:var(--mute);min-width:30px;text-align:center;cursor:pointer}
#peekbar{display:none;gap:6px;align-items:center}#peekbar.on{display:flex}#peekbar .pb{width:auto;padding:0 10px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:12px}
.bm{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;width:68px;color:var(--mute);font-size:11px}
.bm i{font-style:normal;width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink);text-transform:uppercase}
.bm:hover i{border-color:var(--ink)}.bm span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Panels (Settings, Downloads) take the page area while open. */
.panel{max-width:640px;margin:0 auto;padding:28px 24px 60px;user-select:text}
.panel.msgp{max-width:760px;padding:0;height:100%}.panel.msgp #hmx{height:calc(100vh - 64px);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.panel h2{font-weight:300;font-size:30px;letter-spacing:-.5px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:26px 0 8px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-height:50px}
.row>div:first-child{min-width:0}.row small{display:block;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{width:auto;height:26px;padding:0 10px;border-radius:7px;font-size:12px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.btn{width:auto;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:12px}
.sw{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:18px}
select,input.txt{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
input.txt{width:100%;margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.dl .state{font-size:11px;color:var(--mute)}.dl .acts{display:flex;gap:6px;flex:none}
.tab.priv{border-style:dashed}.tab.split{box-shadow:inset 0 -3px 0 var(--mute)}
.tab.drag{opacity:.4}.tab.over{transform:scale(1.08)}
#ws{width:38px;height:24px;border-radius:7px;font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line)}
#tabsbar.h #ws{width:auto;padding:0 8px}
#home .stats{color:var(--mute);font-size:12px;margin-top:-6px;font-variant-numeric:tabular-nums}
#home .stats b{color:var(--ink);font-weight:600}
#find{display:none;flex:1;gap:4px;align-items:center}#pill.finding #bar,#pill.finding #shield{display:none}#pill.finding #find{display:flex}
#findq{all:unset;flex:1;font-size:13.5px;user-select:text}#findn{color:var(--mute);font-size:12px}
.pal{max-width:620px}.pal input#palq{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.res{margin-top:10px;display:grid;gap:4px}
.res button{all:unset;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer;min-width:0}
.res button.sel,.res button:hover{background:var(--card)}
.res i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;text-transform:uppercase}
.res span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res small{color:var(--mute);margin-left:auto;flex:none;font-size:11px}
.qr{width:200px;height:200px;border-radius:12px;overflow:hidden;margin:0 auto;border:1px solid var(--line)}.qr svg{width:100%;height:100%;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{width:auto;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--ink)}
.row a{color:inherit}
.swatches{display:flex;gap:8px;align-items:center}.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mute)}
#toast{position:absolute;background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:99px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.on{opacity:1}
</style>

const EDGE=6;
const railSize=()=>{const tp=pref('tabs_pos'),vert=tp=='left'||tp=='right',big=pref('previews')!='small'&&pref('previews')!='off';
  return vert?(pref('previews')=='off'?168:big?212:184):(pref('previews')=='off'?56:big?132:104)};
let railOff=1, railAnim=null;   // 0 = fully shown, 1 = hidden (only the hover edge left)
function layout(now){
  applyColor();
  const c=pref('density')=='compact', B=c?44:52;
  const tp=pref('tabs_pos'), bp=pref('bar_pos'), pinned=pref('tabs_mode')!='auto';
  document.documentElement.dataset.theme=pref('theme')=='system'?'':pref('theme');
  document.body.classList.toggle('compact',c);
  const ins={top:0,right:0,bottom:0,left:0}, A=$('#addr'), P=$('#page'), L=$('#load');
  A.className=bp;
  const px=o=>Object.entries(o).map(([k,v])=>`${k}:${typeof v=='number'?v+'px':v}`).join(';');
  ins[bp]=B;
  if(pinned)ins[tp]+=railSize();          // pinned: the page makes room once and stays that size
  A.style.cssText=px({[bp]:0,height:B,left:0,right:0});
  P.style.cssText=px({top:ins.top,right:ins.right,bottom:ins.bottom,left:ins.left});
  L.style.cssText=px({left:0,right:0,[bp=='top'?'top':'bottom']:B-1});
  $('#toast').style.cssText=px({right:ins.right+12,top:ins.top+8});
  layout.ins=ins;
  inv('set_layout',ins).catch(()=>{});
  placeRail();railState();
}
// Where the tab bar goes, given how far it's slid out (railOff 0..1).
function placeRail(){
  const tp=pref('tabs_pos'), bp=pref('bar_pos'), vert=tp=='left'||tp=='right', pinned=pref('tabs_mode')!='auto';
  const B=pref('density')=='compact'?44:52, W=innerWidth, H=innerHeight, size=railSize();
  const off=pinned?0:railOff, hidden=Math.round((size-EDGE)*off);
  let x,y,w,h;
  if(vert){ y=bp=='top'?B:0; h=H-B; w=size; x=tp=='left'?-hidden:W-size+hidden; }
  else    { x=0; w=W; h=size; y=tp=='top'?(bp=='top'?B:0)-hidden:(bp=='bottom'?H-B-size:H-size)+hidden; }
  inv('set_rail',{x,y,w,h,visible:true}).catch(()=>{});
}
function slideRail(target){
  if(pref('tabs_mode')!='auto'){railOff=0;placeRail();return}
  cancelAnimationFrame(railAnim);const from=railOff,t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:170;
  const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);railOff=from+(target-from)*ease(k);placeRail();if(k<1)railAnim=requestAnimationFrame(step);else railState()};
  railAnim=requestAnimationFrame(step);
}
function reveal(on){
  if(pref('tabs_mode')!='auto')return;
  clearTimeout(hideT);
  if(on&&!revealed){revealed=true;railState();slideRail(0);if(cur&&tab(cur)&&!panel)inv('capture_tab',{tab:cur}).catch(()=>{})}
  if(!on&&revealed){revealed=false;railState();setTimeout(()=>{if(!revealed)slideRail(1)},90)}
}
function scheduleHide(){clearTimeout(hideT);if(pref('tabs_mode')!='auto')return;
  hideT=setTimeout(()=>{if(!overBar)reveal(false)},Math.max(.5,+pref('hide_delay'))*1000)}
const peek=()=>{reveal(true);if(!overBar)scheduleHide()};   // briefly show the tabs after a tab action
// Everything the tab bar needs to draw itself (it has no state of its own).
function railState(){if(!T.event.emitTo)return;
  const cs=getComputedStyle(document.documentElement),vars={};for(const k of ['--bg','--card','--line','--ink','--mute','--acc','--glow'])vars[k]=cs.getPropertyValue(k).trim();
  const dark=matchMedia('(prefers-color-scheme: dark)').matches?pref('theme')!='light':pref('theme')=='dark';
  T.event.emitTo('rail','rail-state',{tabs:(typeof inWs=='function'?inWs():tabs).map(t=>({id:t.id,url:t.url,title:t.title||'',priv:t.priv,tor:!!t.tor,destruct:HX.destructLabel(t),sleeping:!!t.sleeping,muted:!!t.muted})),
    cur,split,pos:pref('tabs_pos'),ws:typeof curWs=='function'?curWs():'Personal',wsList:typeof wsList=='function'?wsList():[],collapsed:pref('tabs_mode')=='auto'&&!revealed&&railOff>.5,
    pinned:pref('tabs_mode')!='auto',previews:pref('previews'),vars,dark}).catch(()=>{})}
// Clicks and hovers from the tab bar.
T.event.listen('rail-action',async({payload:a})=>{const t=a.id&&tab(a.id);
  switch(a.type){
    case 'ready':railState();break;
    case 'hover':overBar=true;reveal(true);break;
    case 'leave':overBar=false;scheduleHide();break;
    case 'select':select(a.id);break;
    case 'split':toggleSplit(a.id);break;
    case 'close':closeTab(a.id);break;
    case 'new':newTab(false);break;
    case 'newpriv':newTab(true);break;
    case 'ws':openPanel('ws');break;
    case 'mute':if(t){t.muted=!t.muted;inv('set_muted',{tab:t.id,muted:t.muted});railState()}break;
    case 'destruct':if(t){t.destruct=a.min?Date.now()+a.min*60000:0;toast(a.min?'This tab closes in '+a.min+' min':'Self-destruct off');railState()}break;
    case 'dup':if(t)openTab(t.url,{priv:t.priv,tor:t.tor});break;
    case 'others':for(const o of inWs().filter(x=>x.id!=a.id))await closeTab(o.id,true);break;
    case 'move':if(t){t.ws=a.ws;if(cur==t.id){cur=inWs().at(-1)?.id??null;if(cur)inv('switch_tab',{label:cur})}draw();sync();saveSession()}break;
    case 'reorder':{const i=tabs.findIndex(x=>x.id==a.from);if(i<0||!tab(a.to))break;const m=tabs.splice(i,1)[0];tabs.splice(tabs.findIndex(x=>x.id==a.to),0,m);draw();saveSession()}break;
  }});
T.event.listen('tab-title',({payload:p})=>{const t=tab(p.tab);if(t){t.title=p.title}});
addEventListener('resize',()=>layout(true));

// ---------- workspaces ----------
const wsList=()=>pref('workspaces').split('|').filter(Boolean);
const curWs=()=>wsList().includes(pref('ws'))?pref('ws'):wsList()[0];
const inWs=()=>tabs.filter(t=>t.ws==curWs());
async function switchWs(name){await setPref('ws',name);const last=inWs().at(-1);if(last)select(last.id);else{cur=null;draw();sync()}
  $('#ws').textContent=name[0].toUpperCase();toast('Workspace: '+name);peek()}
async function addWs(name){name=name.trim().replace(/\|/g,'').slice(0,24);if(!name||wsList().includes(name))return;
  await setPref('workspaces',[...wsList(),name].join('|'));await switchWs(name)}
async function removeWs(name){if(wsList().length<2)return toast('Keep at least one workspace');
  for(const t of tabs.filter(t=>t.ws==name))await closeTab(t.id,true);
  await setPref('workspaces',wsList().filter(w=>w!=name).join('|'));if(pref('ws')==name)await switchWs(wsList()[0])}

// ---------- tabs ----------
let split=null, findOn=false, statsT=null;
function sync(){const t=tab(cur);inv('show_content',{visible:!panel&&!!t&&t.ws==curWs()}).catch(()=>{})}
function draw(){
  const box=$('#tabs');box.textContent='';const horiz=pref('tabs_pos')=='top'||pref('tabs_pos')=='bottom';
  inWs().forEach((t,i)=>{const d=document.createElement('div');const h=hostOf(t.url).replace(/^www\./,'');
    if(t.sleeping)d.style.opacity='.45';
    d.className='tab'+(t.id==cur?' on':'')+(t.priv?' priv':'')+(t.id==split?' split':'');
    d.title=(t.priv?'Private · ':'')+(h||'Loading…')+'\nShift-click: split view · Middle-click: close · Drag: reorder';
    if(horiz){d.innerHTML='<span></span>';d.firstChild.textContent=(t.priv?'◌ ':'')+(h||'Loading…')}else d.textContent=t.priv?'◌':(h?h[0]:i+1);
    d.setAttribute('role','tab');d.setAttribute('aria-selected',t.id==cur);d.draggable=true;
    d.onclick=e=>e.shiftKey?toggleSplit(t.id):select(t.id);d.onauxclick=e=>{e.preventDefault();if(e.button==1)closeTab(t.id)};
    d.oncontextmenu=e=>{e.preventDefault();toggleSplit(t.id)};
    d.ondragstart=e=>{e.dataTransfer.setData('text/hush-tab',t.id);d.classList.add('drag')};d.ondragend=()=>d.classList.remove('drag');
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const from=e.dataTransfer.getData('text/hush-tab');if(!from||from==t.id)return;
      const a=tabs.findIndex(x=>x.id==from),moved=tabs.splice(a,1)[0];tabs.splice(tabs.findIndex(x=>x.id==t.id),0,moved);draw();saveSession()};
    box.append(d)});
  $('#ws').textContent=curWs()[0].toUpperCase();$('#ws').title='Workspace: '+curWs()+' — click to switch';
  const t=tab(cur), live=t&&t.ws==curWs(), h=live?hostOf(t.url):'';document.body.classList.toggle('tor',!!(live&&t.tor&&!panel));
  if(document.activeElement!==$('#bar')) $('#bar').value=panel||!live?'':t.url;
  const showHome=!live&&!panel;if(showHome&&$('#home').hidden!==false||showHome&&!$('#home').firstChild)renderHome();$('#home').hidden=!showHome;$('#home').style.display=showHome?'block':'none';
  $('#panel').hidden=!panel;
  for(const id of ['back','fwd','reload','pick','star','read','listen','boostb','snap']) $('#'+id).disabled=!live||!!panel;
  $('#lock').style.visibility=live&&!panel&&t.url.startsWith('https:')?'visible':'hidden';
  const off=allow.has(h);$('#shield').classList.toggle('off',off);$('#shield').disabled=!h||!!panel;
  $('#shield').title=(off?'Shield off':'Shield on')+(h?' for '+h:'')+' — click for site settings';
  const n=counts[cur]||0;$('#cnt').textContent=n>99?'99+':n;$('#cnt').style.display=n&&live&&state.settings.counter!==false?'grid':'none';
  const a=downloads.filter(d=>d.state=='started').length;$('#dlcnt').textContent=a;$('#dlcnt').style.display=a?'grid':'none';
  if($('#home').style.display!='none')loadStats();
  railState();
}
async function openTab(v,o={}){closePanel(true);newPending=false;if(!o.background&&!o.quiet)maybeFloat(cur,null);
  const id=await inv('open_tab',{input:v,private:!!(o.priv||o.tor),tor:!!o.tor});tabs.push({id,url:'',priv:!!(o.priv||o.tor),tor:!!o.tor,ws:o.ws||curWs(),zoom:+pref('zoom')/100,last:Date.now()});
  if(pref('zoom')!='100')inv('set_zoom',{factor:+pref('zoom')/100,tab:id}).catch(()=>{});
  if(!o.background){cur=id}draw();layout();sync();if(!o.quiet)peek();return id}
async function wake(t){const id=await inv('open_tab',{input:t.url,private:t.priv,tor:!!t.tor});const old=t.id;t.id=id;t.sleeping=false;if(cur==old)cur=id;return id}
function select(id){closePanel(true);const t=tab(id);if(!t)return;maybeFloat(cur,id);t.last=Date.now();if(t.sleeping){wake(t).then(nid=>{cur=nid;draw();sync()});return}if(t.ws!=curWs()){state.settings.ui.ws=t.ws;inv('set_setting',{key:'ui.ws',value:t.ws})}
  cur=id;if(bgMedia==id){bgMedia=null}npDraw();if(split==id){split=null;inv('set_split',{label:null})}inv('switch_tab',{label:id});draw();sync()}
const closedStack=[];
async function closeTab(id,quiet){if(bgMedia==id){bgMedia=null;npDraw()}if(floating==id){floating=null;await inv('float_close',{stop:true}).catch(()=>{})}{const c=tab(id);if(c&&c.url&&!c.priv){closedStack.push({url:c.url,ws:c.ws});if(closedStack.length>25)closedStack.shift()}}const next=await inv('close_tab',{label:id});tabs=tabs.filter(t=>t.id!=id);delete counts[id];if(split==id)split=null;
  const t=tab(next);cur=t&&t.ws==curWs()?next:(inWs().at(-1)?.id??null);if(cur&&cur!=next)inv('switch_tab',{label:cur});
  draw();layout();sync();saveSession();if(!quiet&&tabs.length)peek()}
function cycle(d){const w=inWs();if(w.length<2)return;const i=w.findIndex(t=>t.id==cur);select(w[(i+d+w.length)%w.length].id);peek()}
function toggleSplit(id){if(id==cur)return toast('Pick a different tab to split with');
  split=split==id?null:id;inv('set_split',{label:split});toast(split?'Split view — shift-click the tab again to close':'Split view closed');draw()}
function go(v){v=v.trim();if(!v)return;closePanel(true);if(newPending||!tab(cur)||tab(cur).ws!=curWs()){openTab(v,{priv:newPending=='priv'})}else inv('navigate',{input:v});newPending=false;$('#bar').blur()}
function newTab(priv){newPending=priv?'priv':true;$('#bar').value='';$('#bar').placeholder=priv?'New private tab — nothing is saved':'New tab — search or enter address';$('#bar').focus()}
let saveT;function saveSession(){if(pref('restore')!='on')return;clearTimeout(saveT);saveT=setTimeout(()=>
  inv('session_save',{tabs:tabs.filter(t=>!t.priv&&t.url.startsWith('https://')).map(t=>({url:t.url,ws:t.ws}))}).catch(()=>{}),800)}

// ---------- address bar + suggestions ----------
let sugSel=0, sugItems=[];
$('#bar').addEventListener('keydown',e=>{
  if(panel=='suggest'&&(e.key=='ArrowDown'||e.key=='ArrowUp')){e.preventDefault();sugSel=(sugSel+(e.key=='ArrowDown'?1:-1)+sugItems.length)%sugItems.length;renderSuggest(true);return}
  if(e.key=='Enter'){const it=panel=='suggest'&&sugItems[sugSel];it?runItem(it):go(e.target.value)}
  if(e.key=='Escape'){newPending=false;closePanel();e.target.blur();draw()}});
$('#bar').addEventListener('input',e=>{const v=e.target.value.trim();if(!v){if(panel=='suggest')closePanel();return}openPanel('suggest')});
$('#bar').addEventListener('focus',e=>e.target.select());
$('#bar').addEventListener('blur',()=>setTimeout(()=>{if(!newPending)$('#bar').placeholder='Search or enter address';if(panel=='suggest'&&document.activeElement!==$('#bar'))closePanel();draw()},150));
async function renderSuggest(keep){
  const q=$('#bar').value.trim();if(!q)return;
  if(!keep){const looksUrl=/^\S+\.\S+$/.test(q)||/^https?:/.test(q);
    sugItems=[{kind:'go',title:looksUrl?'Go to '+q:'Search for “'+q+'”',url:q,icon:looksUrl?'→':'⌕'}];
    const lq=q.toLowerCase();tabs.filter(t=>t.url.toLowerCase().includes(lq)).slice(0,3).forEach(t=>sugItems.push({kind:'tab',title:hostOf(t.url),url:t.url,id:t.id,icon:'⇥',note:'Switch to tab'}));
    try{(await inv('suggest',{q})).forEach(x=>sugItems.push({kind:'url',title:x.title||hostOf(x.url),url:x.url,icon:x.kind=='bookmark'?'★':'↺',note:x.kind=='bookmark'?'Bookmark':'History'}))}catch(e){}
    sugSel=0;if($('#bar').value.trim()!==q||panel!='suggest')return}
  $('#panel').innerHTML=`<div class=res>${sugItems.map((x,i)=>`<button data-i=${i} class="${i==sugSel?'sel':''}"><i>${esc(x.icon||'•')}</i><span>${esc(x.title)}</span><small>${esc(x.note||'')}</small></button>`).join('')}</div>`;
  $('#panel').querySelectorAll('[data-i]').forEach(b=>b.onmousedown=e=>{e.preventDefault();runItem(sugItems[b.dataset.i])});
}
function runItem(x){if(x.kind=='go')go(x.url);else if(x.kind=='tab')select(x.id);else if(x.kind=='url')go(x.url);else if(x.run)x.run()}

// ---------- shortcuts (chrome focused: keydown; page focused: native 'shortcut' event from Rust) ----------
function shortcut(k){
  if(k=='t')newTab(false); else if(k=='shift+n')newTab(true); else if(k=='l'){closePanel();$('#bar').focus()} else if(k=='w'){cur&&closeTab(cur)}
  else if(k=='d')$('#star').click(); else if(k=='j')$('#dls').click(); else if(k==',')$('#gear').click();
  else if(k=='k')panel=='pal'?closePanel():openPanel('pal'); else if(k=='h')panel=='history'?closePanel():openPanel('history');
  else if(k=='f'){if(tab(cur))findMode(true)} else if(k=='e'){if(tab(cur))inv('page_action',{action:'reader'})}
  else if(k=='p'){if(tab(cur))inv('page_action',{action:'print'})}
  else if(/^[1-9]$/.test(k)){const w=inWs();const t=k=='9'?w.at(-1):w[+k-1];if(t){select(t.id);peek()}}
  else if(k=='+'||k=='-'||k=='0'){const t=tab(cur);if(!t)return;t.zoom=k=='0'?1:Math.round(Math.min(3,Math.max(.3,(t.zoom||1)+(k=='+'?.1:-.1)))*10)/10;
    inv('set_zoom',{factor:t.zoom});toast('Zoom '+Math.round(t.zoom*100)+'%')}
  else if(k=='shift+t'){const c=closedStack.pop();if(c)openTab(c.url,{ws:wsList().includes(c.ws)?c.ws:curWs()});else toast('No recently closed tabs')}
  else if(k=='m'){const t=tab(cur);if(t){t.muted=!t.muted;inv('set_muted',{tab:t.id,muted:t.muted});toast(t.muted?'Tab muted':'Tab unmuted');railState()}}
  else if(k=='g'){if(!tab(cur))return;if(findOn&&$('#findq').value)inv('page_action',{action:'find',arg:$('#findq').value});else findMode(true)}
  else if(k=='f11')inv('toggle_fullscreen');
  else if(k=='shift+o')torTab();
  else if(k=='shift+m')panel=='msg'?closePanel():openPanel('msg');
  else if(k=='shift+s'){if(tab(cur))snapshot(true)} else if(k=='shift+r'){if(tab(cur))listenToggle()} else if(k=='shift+a'){if(tab(cur))panel=='boost'?closePanel():openPanel('boost')}
  else if(k=='shift+b')panel=='bookmarks'?closePanel():openPanel('bookmarks');
  else if(k=='\\'){const o=inWs().filter(t=>t.id!=cur).at(-1);if(split)toggleSplit(split);else if(o)toggleSplit(o.id)}
  else if(k=='tab')cycle(1); else if(k=='shift+tab')cycle(-1);
  else if(k=='b'){if(pref('tabs_mode')!='auto'){toast('Tab bar is pinned — change it in Settings');return}revealed?reveal(false):peek()}
}
addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();

  else if(m&&e.shiftKey&&k=='n'){e.preventDefault();shortcut('shift+n')}
  else if(m&&e.shiftKey&&k=='t'){e.preventDefault();shortcut('shift+t')}
  else if(m&&e.shiftKey&&['b','s','r','a','o','m'].includes(k)){e.preventDefault();shortcut('shift+'+k)}
  else if(m&&/^[0-9]$/.test(e.key)){e.preventDefault();shortcut(e.key)}
  else if(m&&(e.key=='='||e.key=='+')){e.preventDefault();shortcut('+')}else if(m&&e.key=='-'){e.preventDefault();shortcut('-')}
  else if(m&&(k=='m'||k=='g')){e.preventDefault();shortcut(k)}
  else if(e.key=='F11'){e.preventDefault();shortcut('f11')}
  else if(m&&['t','l','w','d','j','b',',','k','h','f','e','p','\\'].includes(k)){e.preventDefault();shortcut(k)}
  else if(m&&k=='r'){e.preventDefault();cur&&inv('nav',{action:'reload'})}
  else if(e.key=='Escape'&&peeking)peekClose();

let palSel=0,palItems=[];
function renderPalette(){
  const p=$('#panel');p.innerHTML=`<input id=palq placeholder="Type a command, tab, or site…" autocomplete=off spellcheck=false><div class=res id=palr></div>`;
  const q=$('#palq');q.focus();q.oninput=()=>{palSel=0;fillPalette(q.value)};
  q.onkeydown=e=>{if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();palSel=(palSel+(e.key=='ArrowDown'?1:-1)+palItems.length)%palItems.length;paintPalette()}
    else if(e.key=='Enter'&&palItems[palSel]){e.preventDefault();runItem(palItems[palSel])}else if(e.key=='Escape')closePanel()};
  fillPalette('');
}
async function fillPalette(q){const lq=q.toLowerCase().trim(),m=s=>!lq||s.toLowerCase().includes(lq);
  let items=ACTIONS().filter(a=>m(a[0])).map(a=>({kind:'run',title:a[0],note:a[1],icon:'›',run:a[2]}));
  tabs.filter(t=>m(t.url)).forEach(t=>items.push({kind:'tab',id:t.id,title:hostOf(t.url)||'New tab',note:(t.ws!=curWs()?t.ws+' · ':'')+'Tab',icon:'⇥'}));
  if(lq){try{(await inv('suggest',{q:lq})).forEach(x=>items.push({kind:'url',url:x.url,title:x.title||hostOf(x.url),note:x.kind=='bookmark'?'Bookmark':'History',icon:x.kind=='bookmark'?'★':'↺'}))}catch(e){}
    items.push({kind:'go',url:q,title:(/^\S+\.\S+$/.test(q)?'Go to ':'Search for ')+q,icon:'→'})}
  if(($('#palq')?.value||'').toLowerCase().trim()!==lq)return;palItems=items.slice(0,14);paintPalette()}
function paintPalette(){const r=$('#palr');if(!r)return;
  r.innerHTML=palItems.map((x,i)=>`<button data-i=${i} class="${i==palSel?'sel':''}"><i>${esc(x.icon)}</i><span>${esc(x.title)}</span><small>${esc(x.note||'')}</small></button>`).join('');
  r.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>runItem(palItems[b.dataset.i]))}

  $('#s-tori').onclick=()=>openPanel('torinfo');
  HX.lookPicker($('#s-look'),()=>{applyColor();renderSettings()});$('#s-gest').onclick=()=>openPanel('gest');$('#s-watch').onclick=()=>openPanel('watch');
  $('#s-ext').onclick=()=>openPanel('ext');$('#s-rl').onclick=()=>openPanel('reading');$('#s-focus').onclick=()=>openPanel('focus');$('#s-send').onclick=()=>openPanel('send');$('#s-about').onclick=()=>openPanel('about');
  $('#s-bangs').onclick=async()=>{const v=prompt('Your shortcuts, separated by | as  key=https://site.com/search?q=%s',pref('bangs'));if(v===null)return;
    const list=v.split(/\||\n/).map(x=>x.trim()).filter(x=>/^[a-z0-9]{1,12}=https:\/\/\S+$/i.test(x));await setPref('bangs',list.join('|'));renderSettings();toast(list.length+' shortcuts saved')};$('#s-ws').onclick=()=>openPanel('ws');
  $('#s-engine').onchange=async e=>{s.search=e.target.value;await inv('set_setting',{key:'search',value:s.search});renderSettings()};
  const cs=$('#s-custom');if(cs)cs.onchange=async()=>{const v=cs.value.trim();if(!v.startsWith('https://')||!v.includes('%s')){toast('Must start with https:// and contain %s');return}
    s.custom_search=v;await inv('set_setting',{key:'custom_search',value:v});toast('Saved')};
  $('#s-counter').onclick=async()=>{s.counter=s.counter===false;await inv('set_setting',{key:'counter',value:String(s.counter)});renderSettings();draw()};
  $('#s-lists').onclick=async e=>{e.target.textContent='Updating…';try{toast(await inv('update_lists'))}catch(err){toast(String(err))}renderSettings()};
  $('#s-wipe').onclick=wipe;
  p.querySelectorAll('[data-allow]').forEach(b=>b.onclick=async()=>{await inv('toggle_shield',{host:b.dataset.allow});allow.delete(b.dataset.allow);renderSettings();draw()});
  $('#s-export').onclick=async()=>{try{await navigator.clipboard.writeText(await inv('export_data'));toast('Copied to clipboard')}catch(e){toast(String(e))}};
  $('#s-import').onclick=async()=>{try{await inv('import_data',{json:$('#s-json').value});await loadState();renderSettings();toast('Imported')}catch(e){toast(String(e))}};
  wire(p);
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':n.toLocaleString();
async function loadStats(){clearTimeout(statsT);try{if(!$('#stats'))return;const s=await inv('get_stats');
  $('#stats').innerHTML=s.total?`<b>${fmt(s.week)}</b> ads & trackers blocked this week · <b>${fmt(s.total)}</b> all time`:'Ads, trackers and cookie banners are blocked automatically.'}catch(e){}
  statsT=setTimeout(()=>{if($('#home').style.display!='none')loadStats()},15000)}

async function loadState(first){try{state=await inv('get_state');state.settings.ui=state.settings.ui||{};allow=new Set(state.allow_sites);
  const box=$('#bms');box.textContent='';
  state.bookmarks.filter(b=>b.folder!='reading').slice(0,12).forEach(b=>{const a=document.createElement('button');a.className='bm';const h=hostOf(b.url).replace(/^www\./,'');
    a.innerHTML='<i></i><span></span>';a.querySelector('i').textContent=h[0]||'•';a.querySelector('span').textContent=b.title||h;a.title=b.url+'\nRight-click to remove';
    a.onclick=()=>openTab(b.url);a.oncontextmenu=async e=>{e.preventDefault();if(confirm('Remove bookmark '+(b.title||h)+'?')){await inv('bookmark_remove',{url:b.url});loadState()}};box.append(a)});
  layout(true);draw();if(!$('#home').hidden&&!document.activeElement?.closest?.('.hx-home'))renderHome();
  if(first&&pref('restore')=='on'&&state.session?.length&&!tabs.length){for(const t of state.session)await openTab(t.url,{ws:wsList().includes(t.ws)?t.ws:curWs(),quiet:true,background:true});
    const last=inWs().at(-1);if(last)select(last.id);toast('Restored '+state.session.length+' tabs')}
}catch(e){console.error(e)}}
layout(true);draw();loadState(true);$('#bar').focus();
</script>

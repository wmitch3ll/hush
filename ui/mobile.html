<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hush</title>
<style>
/* Grayscale tokens — same names as ui/index.html. Light / dark (system) / forced via [data-theme]. Private tab: body.priv */
:root{--bg:#f2f2f2;--ink:#111;--mute:#8c8c8c;--card:#fff;--line:#e0e0e0;--acc:#111;--glow:#00000014;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--ink:#eee;--mute:#808080;--card:#1a1a1a;--line:#2a2a2a;--acc:#eee;--glow:#ffffff14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--ink:#eee;--mute:#808080;--card:#1a1a1a;--line:#2a2a2a;--acc:#eee;--glow:#ffffff14;color-scheme:dark}
body.priv{--bg:#050505;--ink:#e6e6e6;--mute:#777;--card:#161616;--line:#2b2b2b;--acc:#ddd;--glow:#ffffff14;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;flex-direction:column}
body.bottom #app{flex-direction:column-reverse}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.35}
#top{display:flex;gap:6px;align-items:center;padding:8px 10px;position:relative;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);touch-action:pan-y}
body.bottom #top{border-bottom:0;border-top:1px solid var(--line)}
#pill{flex:1;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 3px;height:40px;min-width:0;transition:transform .18s,opacity .18s}
#pill:focus-within{border-color:var(--mute);box-shadow:0 0 0 3px var(--glow)}
#pill.sl{transform:translateX(-28px);opacity:0}#pill.sr{transform:translateX(28px);opacity:0}
#url,#findq{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px;height:100%;text-overflow:ellipsis}
#url::placeholder,#findq::placeholder{color:var(--mute)}
#find{display:none;flex:1;align-items:center;gap:2px;min-width:0}#findn{color:var(--mute);font-size:12px;padding:0 4px;font-variant-numeric:tabular-nums}
#pill.finding #find{display:flex}#pill.finding #shield,#pill.finding #url,#pill.finding #reload{display:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--line)}
#shield.off{opacity:.4}#shield.priv::after{content:"";position:absolute;inset:9px;border:1.5px dashed var(--mute);border-radius:50%}
#tabs-btn span{width:22px;height:22px;border:1.6px solid var(--ink);border-radius:7px;font-weight:600;font-size:12px;display:grid;place-items:center}
body.priv #tabs-btn span{border-style:dashed}
#bar{height:2px;background:var(--acc);width:0;position:absolute;left:0;bottom:-1px;transition:width .4s,opacity .3s;opacity:0}
body.bottom #bar{bottom:auto;top:-1px}
#bar.on{opacity:1;width:70%;transition:width 6s cubic-bezier(.1,.6,.2,1)}#bar.done{opacity:0;width:100%}
#view{flex:1;overflow:auto;position:relative}
.home{display:grid;place-items:center;text-align:center;padding:12vh 18px 40px}
.home .wordmark{font:300 62px/1 ui-serif,"Times New Roman",Times,Georgia,serif;letter-spacing:-2px;margin:0 auto 12px}.home p{color:var(--mute)}
.home .stats{font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}.home .stats b{color:var(--ink)}
.home.priv .wordmark{opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin-top:30px;width:100%;max-width:420px}
.bm{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--mute);min-width:0}
.bm i{width:54px;height:54px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:19px;font-weight:600;color:var(--ink);text-transform:uppercase}
.bm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--mute);font-size:12px;margin-top:26px;line-height:1.7}
.sug{padding:6px 10px}.sug button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 8px;border-radius:12px;text-align:left;min-width:0}
.sug button:active,.sug button.sel{background:var(--card)}
.sug i{font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.sug span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.sug small{color:var(--mute);font-size:11px;flex:none}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:none;flex-direction:column;gap:8px;overflow:auto;transition:transform .2s}
.sheet.on{display:flex;animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet h2{font-weight:300;font-size:28px;letter-spacing:-.5px;display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px;touch-action:none}
.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 2px 2px;font-weight:600}
.sheet>*{flex:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;min-height:190px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;min-width:0;touch-action:pan-y;transition:transform .2s,opacity .2s}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}.card.priv{border-style:dashed}
.card .shot{flex:1;background:var(--bg) center top/cover no-repeat;border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font:300 28px ui-serif,Georgia,serif}
.card .meta{padding:8px 10px 10px;min-width:0;display:grid}
.card .x{background:var(--card);border-radius:50%;width:30px;height:30px;top:6px;right:6px;box-shadow:0 1px 3px #0003}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
.card b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{position:absolute;top:4px;right:4px;width:36px;height:36px;color:var(--mute);font-size:16px}
.card .tag{position:absolute;top:12px;left:12px;font-size:11px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips button{flex:none;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--card)}
.chips button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;text-align:center}
.btn.acc{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}.btn.sm{flex:none;padding:7px 12px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;min-height:52px}
.item>div{min-width:0}.item small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:20px}
select,textarea,input.txt{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea,input.txt{width:100%}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.qr{width:220px;height:220px;border-radius:14px;overflow:hidden;margin:6px auto;border:1px solid var(--line)}.qr svg{display:block;width:100%;height:100%}
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-radius:18px 18px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -8px 30px #0003;display:none;flex-direction:column;gap:4px;touch-action:none}
.act.on{display:flex;animation:up .18s ease-out}.act .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.act p{color:var(--mute);font-size:12px;padding:0 6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act button{text-align:left;padding:13px 10px;border-radius:10px;font-size:15px}.act button:active{background:var(--line)}
#scrim{position:fixed;inset:0;background:#0005;z-index:19;display:none}#scrim.on{display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;transition:.25s;z-index:30;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.bottom #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id="app">
  <div id="top">
    <div id="pill">
      <button class="ib" id="shield" aria-label="Site settings"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></button>
      <input id="url" inputmode="url" enterkeyhint="go" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
      <button class="ib" id="reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/></svg></button>
      <span id="find"><input id="findq" enterkeyhint="search" placeholder="Find in page" autocapitalize="off" spellcheck="false"><span id="findn"></span>
        <button class="ib" id="findup" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button class="ib" id="finddn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="ib" id="findx" aria-label="Close find"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    </div>
    <button id="tabs-btn" class="ib" aria-label="Tabs"><span>1</span></button>
    <button id="menu-btn" class="ib" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></button>
    <div id="bar"></div>
  </div>
  <div id="view"></div>
</div>
<div class="sheet" id="switcher"></div>
<div class="sheet" id="menu"></div>
<div class="sheet" id="settings"></div>
<div class="sheet" id="downloads"></div>
<div class="sheet" id="site"></div>
<div class="sheet" id="history"></div>
<div class="sheet" id="cmd"></div>
<div id="scrim"></div><div class="act" id="act"></div>
<div id="toast" role="status"></div>
<script src="qr.js"></script>
<script>
const TA=window.__TAURI__, $=s=>document.querySelector(s);
const inv=(c,a)=>TA?TA.core.invoke(c,a||{}):Promise.reject("not in app");
const ANDROID=/Android/i.test(navigator.userAgent);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hostOf=u=>{try{return new URL(u).hostname}catch{return""}};
const bare=u=>hostOf(u).replace(/^www\./,"");
const vibe=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const WORDMARK=`<div class="wordmark">hush.</div>`;
let state={settings:{search:"duckduckgo",ui:{}},bookmarks:[],allow_sites:[],site_dark:{},session:[]}, allow=new Set();
// tabs: {id, native (label of the native WebView; null = not opened yet), url, title, priv, ws, canBack, canFwd}
let tabs=[], cur=null, nid=1, sheet=null, downloads=[], typing=false, finding=false;
const T=()=>tabs.find(t=>t.id===cur);

// ---------- preferences (stored in Rust as ui.<name>) ----------
const DEF={color:"graphite",bar_pos:"top",theme:"system",text_zoom:"100",desktop:"false",pull_refresh:"true",force_dark:"false",history:"off",restore:"off",workspaces:"Personal",ws:"Personal"};
const pref=k=>state.settings.ui?.[k]??DEF[k];
async function setPref(k,v){state.settings.ui[k]=String(v);applyPrefs();try{await inv("set_setting",{key:"ui."+k,value:String(v)})}catch(e){}}
// Browser color: a hue/saturation tints every surface; light and dark variants are derived from it.
const COLORS={graphite:null,sand:[35,32],sage:[145,20],ocean:[205,48],rose:[345,42],plum:[275,30],ember:[18,62]};
function hexHS(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60+360)%360}return[h,d?Math.round(d/(1-Math.abs(2*l-1))*100):0]}
function applyColor(){const c=pref("color"),v=/^#[0-9a-f]{6}$/i.test(c)?hexHS(c):COLORS[c],r=document.documentElement.style;
  const P=["--bg","--card","--line","--ink","--mute","--acc","--glow"];if(!v){P.forEach(p=>r.removeProperty(p));return}
  const [h,s]=v,dark=pref("theme")==="dark"||(pref("theme")==="system"&&matchMedia("(prefers-color-scheme: dark)").matches),H=(l,k)=>`hsl(${h} ${Math.round(s*k)}% ${l}%)`;
  const t=dark?{"--bg":H(8,.35),"--card":H(12,.35),"--line":H(21,.3),"--ink":H(93,.25),"--mute":H(60,.15),"--acc":H(68,1),"--glow":`hsl(${h} ${s}% 68% / .22)`}
             :{"--bg":H(95,.5),"--card":H(99,.6),"--line":H(87,.35),"--ink":H(12,.45),"--mute":H(48,.15),"--acc":H(40,1),"--glow":`hsl(${h} ${s}% 40% / .18)`};
  for(const k in t)r.setProperty(k,t[k])}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyColor);
function applyPrefs(){
  const t=pref("theme");if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=t;
  applyColor();
  document.body.classList.toggle("bottom",pref("bar_pos")==="bottom");
  inv("set_web_prefs",{textZoom:+pref("text_zoom"),desktop:pref("desktop")==="true",pullRefresh:pref("pull_refresh")==="true"}).catch(()=>{});
  requestAnimationFrame(insets);
}
// Native tab views sit between the bars. Android wants device pixels.
function insets(){
  const a=$("#app").getBoundingClientRect(), b=$("#top").getBoundingClientRect(), k=ANDROID?devicePixelRatio:1, bottom=pref("bar_pos")==="bottom";
  const cs=getComputedStyle($("#app")), top=bottom?a.top+parseFloat(cs.paddingTop):b.bottom;
  const bot=bottom?innerHeight-b.top:innerHeight-a.bottom+parseFloat(cs.paddingBottom);
  inv("set_chrome_inset",{px:Math.round(top*k),bottom:Math.round(Math.max(0,bot)*k)}).catch(()=>{});
}
addEventListener("resize",()=>insets());

// ---------- workspaces ----------
const wsList=()=>pref("workspaces").split("|").filter(Boolean);
const curWs=()=>wsList().includes(pref("ws"))?pref("ws"):wsList()[0];
const inWs=()=>tabs.filter(t=>t.ws===curWs());
async function switchWs(name,dir){await setPref("ws",name);const last=inWs().at(-1);if(last)cur=last.id;else newTab(false,true);
  render();if(sheet==="switcher")drawSwitcher(dir);toast(name)}

// ---------- tabs ----------
function newTab(priv,quiet){const t={id:nid++,native:null,url:"",title:"",priv:!!priv,ws:curWs(),canBack:false,canFwd:false};tabs.push(t);cur=t.id;
  if(!quiet){show(null);render();setTimeout(()=>$("#url").focus(),80)}return t}
function select(id,anim){const t=tabs.find(x=>x.id===id);if(!t)return;if(t.ws!==curWs())setPref("ws",t.ws);cur=id;show(null);
  if(anim){const p=$("#pill");p.classList.add(anim);setTimeout(()=>p.classList.remove(anim),180)}
  if(t.url&&!t.native)openNative(t);render()}
async function openNative(t){try{const r=await inv("open_tab",{input:t.url,private:t.priv});t.native=typeof r==="string"?r:r;render()}catch(e){toast("Couldn’t open that page")}}
function syncNative(){const t=T();inv("switch_tab",{label:!sheet&&!typing&&t&&t.native?t.native:"none"}).catch(()=>{})}
async function closeTab(id){const t=tabs.find(x=>x.id===id);if(t&&t.native)inv("close_tab",{label:t.native}).catch(()=>{});
  tabs=tabs.filter(x=>x.id!==id);if(!inWs().length)newTab(false,true);else if(cur===id)cur=inWs().at(-1).id;render();saveSession();if(sheet==="switcher")drawSwitcher()}
function step(d){const w=inWs();if(w.length<2){toast(d>0?"No tab to the right":"No tab to the left");return}const i=w.findIndex(t=>t.id===cur),j=i+d;
  if(j<0||j>=w.length){toast(d>0?"Last tab":"First tab");return}vibe();select(w[j].id,d>0?"sl":"sr");toast(bare(w[j].url)||"New tab")}
async function go(v){
  v=v.trim();if(!v)return;const t=T();typing=false;$("#url").blur();progress(true);
  try{ if(t.native) await inv("navigate",{input:v}); else { t.url=v; t.native=await inv("open_tab",{input:v,private:t.priv}); } }
  catch(e){progress(false);return toast("Couldn’t open that page")}
  render();
}
function render(){
  const t=T(), h=t?hostOf(t.url):"", live=!!(t&&t.native);
  document.body.classList.toggle("priv",!!t?.priv);
  if(document.activeElement!==$("#url"))$("#url").value=live?bare(t.url):"";
  $("#url").placeholder=t?.priv?"Private — nothing is saved":"Search or enter address";
  $("#shield").classList.toggle("off",allow.has(h));$("#shield").classList.toggle("priv",!!t?.priv);
  $("#tabs-btn span").textContent=inWs().length;
  if(typing){renderSuggest();syncNative();return}
  $("#view").innerHTML=live?"":`<div class="home ${t?.priv?"priv":""}">${WORDMARK}<p>${t?.priv?"private tab — nothing here gets saved.":"nothing here but you."}</p>
    <p class="stats" id="stats"></p><div class="grid">${state.bookmarks.slice(0,12).map((b,i)=>`<button class="bm" data-bm="${i}"><i>${esc((bare(b.url)||"?")[0])}</i><span>${esc(b.title||bare(b.url))}</span></button>`).join("")}</div>
    <p class="hint">Swipe the address bar ← → to switch tabs · swipe it ${pref("bar_pos")==="bottom"?"up":"down"} for all tabs · hold it for commands</p></div>`;
  $("#view").querySelectorAll("[data-bm]").forEach(b=>{const bm=state.bookmarks[b.dataset.bm];
    gesture(b,{tap:()=>go(bm.url),long:()=>actions(bm.title||bare(bm.url),[["Open",()=>go(bm.url)],["Open in new tab",()=>{newTab(false,true);go(bm.url)}],
      ["Remove bookmark",async()=>{await inv("bookmark_remove",{url:bm.url});await loadState()}]])})});
  if(!live)loadStats();
  syncNative();
}
function progress(on){const b=$("#bar");b.classList.remove("done");if(on){b.classList.remove("on");void b.offsetWidth;b.classList.add("on")}else{b.classList.remove("on");b.classList.add("done")}}
let saveT;function saveSession(){if(pref("restore")!=="on")return;clearTimeout(saveT);saveT=setTimeout(()=>
  inv("session_save",{tabs:tabs.filter(t=>!t.priv&&t.url.startsWith("https://")).map(t=>({url:t.url,ws:t.ws}))}).catch(()=>{}),800)}
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?Math.round(n/1e3)+"k":n.toLocaleString();
async function loadStats(){try{const s=await inv("get_stats"),el=$("#stats");if(el)el.innerHTML=s.total?`<b>${fmt(s.week)}</b> ads & trackers blocked this week · <b>${fmt(s.total)}</b> all time`:"Ads, trackers and cookie banners are blocked automatically."}catch(e){}}

// ---------- gestures: one helper for tap / long-press / swipes ----------
function gesture(el,h){let x0,y0,t0,lp,moved,fired;
  el.addEventListener("touchstart",e=>{const p=e.touches[0];x0=p.clientX;y0=p.clientY;t0=Date.now();moved=false;fired=false;
    if(h.long)lp=setTimeout(()=>{fired=true;vibe();h.long()},480)},{passive:true});
  el.addEventListener("touchmove",e=>{const p=e.touches[0],dx=p.clientX-x0,dy=p.clientY-y0;

   ${item("Workspaces",esc(wsList().join(" · ")),`<button class="btn sm" id="s-ws">Edit</button>`)}
   <h3>Search</h3>
   ${item("Search engine","",`<select id="s-engine">${[["duckduckgo","DuckDuckGo"],["brave","Brave"],["startpage","Startpage"],["ecosia","Ecosia"],["custom","Custom…"]].map(([v,l])=>`<option value="${v}" ${s.search===v?"selected":""}>${l}</option>`).join("")}</select>`)}
   ${s.search==="custom"?`<input class="txt" id="s-custom" placeholder="https://example.com/search?q=%s" value="${esc(s.custom_search)}">`:""}
   <h3>Privacy</h3>
   <button class="item" id="s-lists"><div>Update filter lists<small>ads, trackers and cookie banners</small></div></button>
   <button class="item" id="s-clear"><div>Clear browsing data<small>cookies · cache · site storage</small></div></button>
   ${allow.size?[...allow].map(h=>item(esc(h),"Shield off on this site",`<button class="btn sm" data-allow="${esc(h)}">Turn on</button>`)).join(""):item("Shield exceptions","None — the shield is on everywhere")}
   <h3>Your data</h3>
   <button class="item" id="s-export"><div>Export<small>copy settings, bookmarks and filters as text</small></div></button>
   <textarea id="s-json" rows="3" placeholder="Paste an export here to import it"></textarea>
   <button class="btn" id="s-import">Import</button>
   <h3>Gestures</h3>
   <div class="item" style="display:block;line-height:1.9;font-size:13px">Address bar: swipe ← → switch tabs · swipe ${toPage()} all tabs · hold for commands<br>
    Tab cards: swipe sideways to close · hold to move or copy · Workspaces: swipe the chips<br>Shield: tap for site settings · hold to toggle · Links: hold for options<br>
    Tabs button: hold for new / private tab · Menu: hold to find in page · Pull down a page to refresh · Swipe a sheet’s title down to close it</div>
   <p style="color:var(--mute);font-size:12px;text-align:center;margin-top:14px">Hush keeps everything on this device. No accounts, no tracking.</p>`;
  wire(el);
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{await setPref(b.dataset.k,b.dataset.v);drawSettings();render()});
  el.querySelectorAll("[data-color]").forEach(b=>b.onclick=async()=>{await setPref("color",b.dataset.color);drawSettings()});
  $("#s-color").oninput=e=>{state.settings.ui.color=e.target.value;applyColor()};$("#s-color").onchange=async e=>{await setPref("color",e.target.value);drawSettings()};
  el.querySelectorAll("[data-sw]").forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,on=b.classList.contains("on"),bin=["force_dark","pull_refresh","desktop"].includes(k);
    await setPref(k,bin?String(!on):(on?"off":"on"));if(k==="force_dark")applyDarkNow();if(k==="restore")saveSession();drawSettings()});
  $("#s-ws").onclick=()=>{const n=prompt("Workspaces, separated by commas",wsList().join(", "));if(n===null)return;
    const list=[...new Set(n.split(",").map(x=>x.trim().replace(/\|/g,"").slice(0,24)).filter(Boolean))];if(!list.length)return;
    tabs.forEach(t=>{if(!list.includes(t.ws))t.ws=list[0]});setPref("workspaces",list.join("|")).then(()=>{drawSettings();render()})};
  $("#s-engine").onchange=async e=>{s.search=e.target.value;await inv("set_setting",{key:"search",value:s.search});drawSettings()};
  const cs=$("#s-custom");if(cs)cs.onchange=async()=>{const v=cs.value.trim();if(!v.startsWith("https://")||!v.includes("%s"))return toast("Must start with https:// and contain %s");
    s.custom_search=v;await inv("set_setting",{key:"custom_search",value:v});toast("Saved")};
  $("#s-lists").onclick=async()=>{toast("Updating…");try{toast(await inv("update_lists"))}catch(e){toast("Update failed")}};
  $("#s-clear").onclick=clearData;
  el.querySelectorAll("[data-allow]").forEach(b=>b.onclick=async()=>{await inv("toggle_shield",{host:b.dataset.allow});allow.delete(b.dataset.allow);drawSettings();render()});
  $("#s-export").onclick=async()=>{try{const j=await inv("export_data");try{await navigator.clipboard.writeText(j);toast("Copied")}catch(e){$("#s-json").value=j;toast("Select the text above to copy it")}}catch(e){toast("Export failed")}};
  $("#s-import").onclick=async()=>{try{await inv("import_data",{json:$("#s-json").value});await loadState();drawSettings();toast("Imported")}catch(e){toast("Not a Hush export")}};
}
function clearData(){if(confirm("Clear cookies, cache and site data for every site?")){inv("clear_data");show(null);toast("Browsing data cleared")}}

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
async function loadState(first){try{state=await inv("get_state");state.settings.ui=state.settings.ui||{};state.site_dark=state.site_dark||{};allow=new Set(state.allow_sites||[])}catch(e){}
  applyPrefs();
  if(first&&pref("restore")==="on"&&state.session?.length){tabs=[];state.session.forEach(s=>tabs.push({id:nid++,native:null,url:s.url,title:"",priv:false,ws:wsList().includes(s.ws)?s.ws:curWs(),canBack:false,canFwd:false}));
    const last=inWs().at(-1);if(last){cur=last.id;openNative(last)}else newTab(false,true);toast("Restored "+state.session.length+" tabs")}
  render()}
newTab(false,true);render();loadState(true);
</script>
</body></html>

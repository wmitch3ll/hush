const curWs=()=>wsList().includes(pref("ws"))?pref("ws"):wsList()[0];
const inWs=()=>tabs.filter(t=>t.ws===curWs());
async function switchWs(name,dir){await setPref("ws",name);const last=inWs().at(-1);if(last)cur=last.id;else newTab(false,true);
  render();if(sheet==="switcher")drawSwitcher(dir);toast(name)}

// ---------- tabs ----------
function newTab(priv,quiet){maybeFloat(cur);const t={id:nid++,native:null,url:"",title:"",priv:!!priv,ws:curWs(),canBack:false,canFwd:false,last:Date.now()};tabs.push(t);cur=t.id;
  if(!quiet){show(null);render();setTimeout(()=>$("#url").focus(),80)}return t}
function select(id,anim){const t=tabs.find(x=>x.id===id);if(!t)return;if(t.ws!==curWs())setPref("ws",t.ws);if(id!==cur)maybeFloat(cur);if(floating===t.native){floating=null;native("floatClose",{stop:false}).catch(()=>{})}if(bgMedia===id){bgMedia=null;native("media",{id:t.native,action:"release"}).catch(()=>{})}cur=id;t.last=Date.now();show(null);
  if(anim){const p=$("#pill");p.classList.add(anim);setTimeout(()=>p.classList.remove(anim),180)}
  if(t.url&&!t.native)openNative(t);render()}
async function openNative(t){try{const r=await inv("open_tab",{input:t.url,private:t.priv});t.native=typeof r==="string"?r:r;render()}catch(e){toast("Couldn’t open that page")}}

  tabs=tabs.filter(x=>x.id!==id);if(!inWs().length)newTab(false,true);else if(cur===id)cur=inWs().at(-1).id;render();saveSession();if(sheet==="switcher")drawSwitcher()}
function step(d){const w=inWs();if(w.length<2){toast(d>0?"No tab to the right":"No tab to the left");return}const i=w.findIndex(t=>t.id===cur),j=i+d;
  if(j<0||j>=w.length){toast(d>0?"Last tab":"First tab");return}vibe();select(w[j].id,d>0?"sl":"sr");toast(bare(w[j].url)||"New tab")}
async function go(v){
  v=v.trim();if(!v)return;const t=T();typing=false;$("#url").blur();progress(true);
  try{ if(t.native) await inv("navigate",{input:v}); else { t.url=v; t.native=await inv("open_tab",{input:v,private:t.priv}); } }
  catch(e){progress(false);return toast("Couldn’t open that page")}

function render(){

  if(live){$("#view").innerHTML="";$("#view").dataset.h=""}else if($("#view").dataset.h!==hk){$("#view").dataset.h=hk;renderHome(t)}

// ---------- gestures: one helper for tap / long-press / swipes ----------
function gesture(el,h){let x0,y0,t0,lp,moved,fired;
  el.addEventListener("touchstart",e=>{const p=e.touches[0];x0=p.clientX;y0=p.clientY;t0=Date.now();moved=false;fired=false;
    if(h.long)lp=setTimeout(()=>{fired=true;vibe();h.long()},480)},{passive:true});
  el.addEventListener("touchmove",e=>{const p=e.touches[0],dx=p.clientX-x0,dy=p.clientY-y0;
    if(Math.abs(dx)>10||Math.abs(dy)>10){moved=true;clearTimeout(lp)}if(h.drag)h.drag(dx,dy,e)},{passive:true});
  el.addEventListener("touchend",e=>{clearTimeout(lp);const p=e.changedTouches[0],dx=p.clientX-x0,dy=p.clientY-y0,fast=Date.now()-t0<600;
    if(fired){e.preventDefault();return}
    if(moved&&fast&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();(dx<0?h.left:h.right)?.()}
    else if(moved&&fast&&Math.abs(dy)>45&&Math.abs(dy)>Math.abs(dx)*1.4){e.preventDefault();(dy<0?h.up:h.down)?.()}
    else if(moved&&h.dragEnd)h.dragEnd(dx,dy);
    else if(!moved&&h.tap){e.preventDefault();h.tap()}},{passive:false});
  if(h.tap)el.addEventListener("click",e=>{if(!("ontouchstart" in window))h.tap()});
}

  tabs.filter(t=>t.id!==cur&&t.url.toLowerCase().includes(q.toLowerCase())).slice(0,2).forEach(t=>sugItems.push({tab:t.id,icon:"⇥",title:t.title||bare(t.url),note:"Tab"}));

    HX.markup(d.data,{name:"Hush "+(t?bare(t.url):""),save:async x=>{await native("saveImage",{data:x});setTimeout(()=>show(null),0);return "Photos › Pictures/Hush"}});

      ["Open in background",()=>{const keep=cur,t=newTab(false,true);t.url=u;cur=keep;inv("open_tab",{input:u}).then(id=>{t.native=id;inv("switch_tab",{label:T().native||"none"});render()});toast("Opened in background")}],

   ${item("Workspaces",esc(wsList().join(" · ")),`<button class="btn sm" id="s-ws">Edit</button>`)}
   <h3>Search</h3>
   ${item("Search engine","",`<select id="s-engine">${[["duckduckgo","DuckDuckGo"],["brave","Brave"],["startpage","Startpage"],["ecosia","Ecosia"],["custom","Custom…"]].map(([v,l])=>`<option value="${v}" ${s.search===v?"selected":""}>${l}</option>`).join("")}</select>`)}
   <button class="item" id="s-bangs"><div>Search shortcuts<small>type !w for Wikipedia, !yt YouTube, !a Amazon, !gh GitHub, !r Reddit, !m maps, !i images… ${pref("bangs")?"· yours: "+esc(pref("bangs").split("|").map(x=>"!"+x.split("=")[0]).join(" ")):"· tap to add your own"}</small></div></button>
   ${s.search==="custom"?`<input class="txt" id="s-custom" placeholder="https://example.com/search?q=%s" value="${esc(s.custom_search)}">`:""}
   <h3>Privacy</h3>
   ${item("Fingerprint protection","Each site sees slightly different device details, so trackers can’t follow you between sites",`<button class="sw ${pref("fp")!=="off"?"on":""}" id="s-fp"></button>`)}
   <button class="item" id="s-lists"><div>Update filter lists<small>ads, trackers and cookie banners</small></div></button>
   <button class="item" id="s-clear"><div>Clear browsing data<small>cookies · cache · site storage</small></div></button>
   ${allow.size?[...allow].map(h=>item(esc(h),"Shield off on this site",`<button class="btn sm" data-allow="${esc(h)}">Turn on</button>`)).join(""):item("Shield exceptions","None — the shield is on everywhere")}
   <h3>Your data</h3>
   <button class="item" id="s-export"><div>Export<small>copy settings, bookmarks and filters as text</small></div></button>
   <textarea id="s-json" rows="3" placeholder="Paste an export here to import it"></textarea>
   <button class="btn" id="s-import">Import</button>
   <h3>Gestures & tools</h3>
   ${item("Two-finger gestures & quick wheel","Swipe a page with two fingers · two-finger hold or hold the tabs button for your wheel",'<button class="btn sm" id="s-gest">Customize</button>')}
   ${item("Clean links","Removes tracking tags from links you open and copy",sw("clean_links",pref("clean_links")!=="off"))}
   ${item("Video controls","Speed, ±10 s, loop and pop-out on any video",sw("video_bar",pref("video_bar")!=="off"))}
   ${item("YouTube quality","Videos start at this quality",seg("video_quality",[["1080","1080p"],["720","720p"],["auto","Auto"]]))}
   <div class="item" style="display:block"><div style="margin-bottom:8px">When you leave a playing video<small>Ask each time · a mini player you can drag and resize · keep playing in the background · or stop</small></div>${seg("video_leave",HX.LEAVE)}</div>
   ${item("Change watch","Get told when a price or text changes",'<button class="btn sm" id="s-watch">Open</button>')}
   <h3>Gestures</h3>
   <div class="item" style="display:block;line-height:1.9;font-size:13px">Address bar: swipe ← → switch tabs · swipe ${toPage()} all tabs · hold for commands<br>
    Tab cards: swipe sideways to close · hold to move or copy · Workspaces: swipe the chips<br>Shield: tap for site settings · hold to toggle · Links: hold for options<br>
    Tabs button: hold for new / private tab · Menu: hold to find in page · Pull down a page to refresh · Swipe a sheet’s title down to close it</div>
   <p style="color:var(--mute);font-size:12px;text-align:center;margin-top:14px">Hush keeps everything on this device. No accounts, no tracking.</p>`;
  wire(el);
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{await setPref(b.dataset.k,b.dataset.v);drawSettings();render()});
  el.querySelectorAll("[data-color]").forEach(b=>b.onclick=async()=>{await setPref("color",b.dataset.color);drawSettings()});
  $("#s-color").oninput=e=>{state.settings.ui.color=e.target.value;applyColor()};$("#s-color").onchange=async e=>{await setPref("color",e.target.value);drawSettings()};
  el.querySelectorAll("[data-sw]").forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,on=b.classList.contains("on"),bin=["force_dark","pull_refresh","desktop","bg_play"].includes(k);
    await setPref(k,bin?String(!on):(on?"off":"on"));if(k==="force_dark")applyDarkNow();if(k==="restore")saveSession();drawSettings()});
  HX.lookPicker($("#s-look"),()=>{applyPrefs();drawSettings()});
  $("#s-gest").onclick=()=>{$("#xs").innerHTML=head("Gestures & quick wheel")+'<div id="gx" style="padding:0 4px 20px"></div>';wire($("#xs"));HX.gesturePanel($("#gx"));show("xs")};
  $("#s-watch").onclick=openWatch;
  $("#s-ws").onclick=()=>{const n=prompt("Workspaces, separated by commas",wsList().join(", "));if(n===null)return;
    const list=[...new Set(n.split(",").map(x=>x.trim().replace(/\|/g,"").slice(0,24)).filter(Boolean))];if(!list.length)return;
    tabs.forEach(t=>{if(!list.includes(t.ws))t.ws=list[0]});setPref("workspaces",list.join("|")).then(()=>{drawSettings();render()})};
  $("#s-engine").onchange=async e=>{s.search=e.target.value;await inv("set_setting",{key:"search",value:s.search});drawSettings()};
  const cs=$("#s-custom");if(cs)cs.onchange=async()=>{const v=cs.value.trim();if(!v.startsWith("https://")||!v.includes("%s"))return toast("Must start with https:// and contain %s");
    s.custom_search=v;await inv("set_setting",{key:"custom_search",value:v});toast("Saved")};
  $("#s-lists").onclick=async()=>{toast("Updating…");try{toast(await inv("update_lists"))}catch(e){toast("Update failed")}};
  $("#s-clear").onclick=clearData;
  $("#s-fp").onclick=async()=>{await setPref("fp",pref("fp")==="off"?"on":"off");toast("Applies to tabs you open from now on");drawSettings()};
  $("#s-bangs").onclick=async()=>{const v=prompt("Your shortcuts, one per line as  key=https://site.com/search?q=%s",pref("bangs").split("|").join("\n"));if(v===null)return;
    const list=v.split(/\n|\|/).map(x=>x.trim()).filter(x=>/^[a-z0-9]{1,12}=https:\/\/\S+$/i.test(x));await setPref("bangs",list.join("|"));drawSettings();toast(list.length+" shortcuts saved")};
  el.querySelectorAll("[data-allow]").forEach(b=>b.onclick=async()=>{await inv("toggle_shield",{host:b.dataset.allow});allow.delete(b.dataset.allow);drawSettings();render()});
  $("#s-export").onclick=async()=>{try{const j=await inv("export_data");try{await navigator.clipboard.writeText(j);toast("Copied")}catch(e){$("#s-json").value=j;toast("Select the text above to copy it")}}catch(e){toast("Export failed")}};
  $("#s-import").onclick=async()=>{try{await inv("import_data",{json:$("#s-json").value});await loadState();drawSettings();toast("Imported")}catch(e){toast("Not a Hush export")}};
}
function clearData(){if(confirm("Clear cookies, cache and site data for every site?")){inv("clear_data");show(null);toast("Browsing data cleared")}}

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
// ---------- links from other apps, shares, widget, tile, hush: imports ----------
async function handleIncoming(){let u="";try{u=(await native("takeIntent")).url||""}catch(e){}if(!u)return;
  if(u==="hush:private")return newTab(true);if(u==="hush:search")return newTab();if(u==="hush:voice"){newTab(false,true);render();return voice()}
  if(/^hush:(\/\/)?add/i.test(u)){const pk=await HM.addFromLink(u);if(pk){openMsgs(pk);toast("Contact added — say hi")}else{openMsgs();toast("Set up Murmur first, then scan again")}return}
  if(u.startsWith("hush://import")||u.startsWith("hush:import")){try{const raw=u.split("#")[1]||"",j=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,"+").replace(/_/g,"/")))));
    const items=(j.b||[]).map(x=>({title:String(x[0]||""),url:String(x[1]||""),folder:String(x[2]||"")})).filter(x=>/^https?:\/\//.test(x.url));
    const tl=(j.t||[]).filter(x=>typeof x==="string"&&/^https:\/\//.test(x)).slice(0,60),st=j.s&&typeof j.s==="object"?j.s:{},sk=Object.keys(st).filter(k=>/^[a-z_]{1,20}$/.test(k)&&typeof st[k]==="string");
    const parts=[items.length?items.length+" bookmarks":"",tl.length?tl.length+" open tabs":"",sk.length?"your settings":""].filter(Boolean);
    if(parts.length&&confirm("Add "+parts.join(", ")+" from your computer?")){if(items.length)await inv("import_bookmarks",{items});
      for(const k of sk)await inv("set_setting",{key:k==="search"?"search":"ui."+k,value:st[k].slice(0,200)}).catch(()=>{});
      await loadState();applyPrefs();for(const u of tl){const t=newTab(false,true);t.url=u}saveSession();render();toast("Synced "+parts.join(", "))}}catch(e){toast("That link couldn’t be read")}return}
  const t=T();if(t&&!t.native)go(u);else{newTab(false,true);go(u)}}
// Memory saver: tabs you haven't looked at for a while give back their memory (they reload when you return).
setInterval(()=>{const m=+pref("memory_saver");if(m>0)native("discardBackground",{minutes:m}).catch(()=>{})},60000);

function drawReading(){const el=$("#reading"),list=state.bookmarks.filter(b=>b.folder==="reading");
  el.innerHTML=head("Reading list")+(list.length?list.map((b,i)=>`<div class="item"><div style="flex:1" data-open="${esc(b.url)}">${esc(b.title||bare(b.url))}<small>${esc(bare(b.url))}</small></div><button class="btn sm" data-done-r="${esc(b.url)}">Done</button></div>`).join("")
    :`<div class="empty">Nothing saved yet.<br>Menu → “Read later” adds the page you’re on.</div>`)+`<p class="hint" style="text-align:center">Tip: Menu → “Save as PDF” keeps a page for offline reading.</p>`;
  wire(el);el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{show(null);const t=T();if(t&&t.native){newTab(false,true)}go(b.dataset.open)});
  el.querySelectorAll("[data-done-r]").forEach(b=>b.onclick=async()=>{await inv("bookmark_remove",{url:b.dataset.doneR});await loadState();drawReading()})}

function focusLeft(){return Math.max(0,+pref("focus_until")-Date.now()/1000)}
function drawFocus(){const el=$("#focus"),left=focusLeft(),sites=pref("focus_sites").split(",").map(x=>x.trim()).filter(Boolean);
  el.innerHTML=head("Focus mode")+(left>0?`<div class="item"><div>Focus is on<small>${Math.ceil(left/60)} minutes left · ${sites.length} sites paused</small></div><button class="btn sm" id="f-end">End</button></div>`
    :`<p style="color:var(--mute);margin:0 4px 6px">Pause distracting sites for a while. They show a calm “hush.” page instead.</p>
      <div class="chips">${[25,50,90,180].map(m=>`<button data-min="${m}">${m<60?m+" min":m/60+" h"}</button>`).join("")}</div>`)+
    `<h3>Paused sites</h3>${sites.map(s=>item(esc(s),"",`<button class="btn sm" data-rm="${esc(s)}">Remove</button>`)).join("")}
     <div class="row"><input class="txt" id="f-add" placeholder="Add a site, e.g. news.com" autocapitalize="off"><button class="btn sm" id="f-addb">Add</button></div>`;
  wire(el);
  el.querySelectorAll("[data-min]").forEach(b=>b.onclick=async()=>{await setPref("focus_until",String(Math.floor(Date.now()/1000)+ +b.dataset.min*60));toast("Focus on for "+b.textContent);drawFocus()});
  if($("#f-end"))$("#f-end").onclick=async()=>{await setPref("focus_until","0");drawFocus()};
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{await setPref("focus_sites",sites.filter(x=>x!==b.dataset.rm).join(","));drawFocus()});
  $("#f-addb").onclick=async()=>{const v=bare("https://"+$("#f-add").value.trim().replace(/^https?:\/\//,""));if(v&&!sites.includes(v)){await setPref("focus_sites",[...sites,v].join(","));drawFocus()}}}

async function drawAbout(){const el=$("#about");let info={build:"?"};try{info=await inv("app_info")}catch(e){}
  el.innerHTML=head("About Hush")+`<div style="text-align:center;margin:8px 0 4px"><div class="wordmark" style="font:300 44px ui-serif,'Times New Roman',Georgia,serif">hush.</div>
    <small style="color:var(--mute)">Test build ${esc(info.build)} · Android</small></div>
   <button class="item" id="a-upd"><div>Check for updates<small id="a-updt">Looks for a newer test build on GitHub</small></div></button>
   <button class="item" id="a-def"><div>Make Hush your default browser<small id="a-deft">Links from other apps open here</small></div></button>
   <h3>Privacy policy</h3>
   <div class="item" style="display:block;font-size:13px;line-height:1.6">Hush collects nothing. There are no accounts, no analytics, no crash reports and no Hush servers.
    Your bookmarks, settings and (if you turn it on) history stay on this phone. Hush only connects to the sites you visit, and — when you ask —
    to the filter-list sites (easylist.to, fanboy.co.nz, ublockorigin.github.io) and to GitHub to check for updates.</div>
   <h3>Open-source licenses</h3>
   <div class="item" style="display:block;font-size:12.5px;line-height:1.7">Hush is free software under the <b>GNU GPL v3</b>.<br>
    uBlock Origin scriptlets & filter lists — GPL v3, © Raymond Hill & contributors<br>adblock-rust — MPL 2.0, © Brave Software<br>
    EasyList, EasyPrivacy — GPL v3 / CC BY-SA 3.0, © The EasyList authors<br>Fanboy’s Cookie List — © Fanboy & contributors<br>
    Tauri, wry, tao — MIT / Apache 2.0<br>AndroidX libraries — Apache 2.0<br>QR code generator based on Project Nayuki’s algorithm — MIT</div>`;
  wire(el);
  $("#a-upd").onclick=async()=>{$("#a-updt").textContent="Checking…";try{const u=await inv("check_update");
      if(u.newer){$("#a-updt").textContent=`Build ${u.latest} is ready — tap to open it`;$("#a-upd").onclick=()=>{show(null);newTab(false,true);go(u.page)}}
      else $("#a-updt").textContent="You’re on the newest build ("+u.latest+")"}
    catch(e){if(String(e).includes("private")){$("#a-updt").textContent="Your GitHub repo is private — tap to open the releases page";$("#a-upd").onclick=()=>{show(null);newTab(false,true);go("https://github.com/wmitch3ll/hush/releases")}}
      else $("#a-updt").textContent="Couldn’t check right now"}};
  $("#a-def").onclick=()=>native("askDefault");
  native("isDefault").then(r=>{if(r&&r.default)$("#a-deft").textContent="Hush is your default browser ✓"}).catch(()=>{})}

async function loadState(first){try{state=await inv("get_state");state.settings.ui=state.settings.ui||{};state.site_dark=state.site_dark||{};allow=new Set(state.allow_sites||[])}catch(e){}
  applyPrefs();
  if(first&&pref("restore")==="on"&&state.session?.length){tabs=[];state.session.forEach(s=>tabs.push({id:nid++,native:null,url:s.url,title:"",priv:false,ws:wsList().includes(s.ws)?s.ws:curWs(),canBack:false,canFwd:false}));
    const last=inWs().at(-1);if(last){cur=last.id;openNative(last)}else newTab(false,true);toast("Restored "+state.session.length+" tabs")}
  render()}
newTab(false,true);render();loadState(true).then(handleIncoming);
</script>
</body></html>

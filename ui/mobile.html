<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hush</title>
<style>
/* Grayscale tokens — same names as ui/index.html. Light / dark (system) / forced via [data-theme]. Private tab: body.priv */
:root{--bg:#f2f2f2;--ink:#111;--mute:#8c8c8c;--card:#fff;--line:#e0e0e0;--acc:#111;--glow:#00000014;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--ink:#eee;--mute:#808080;--card:#1a1a1a;--line:#2a2a2a;--acc:#eee;--glow:#ffffff14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--ink:#eee;--mute:#808080;--card:#1a1a1a;--line:#2a2a2a;--acc:#eee;--glow:#ffffff14;color-scheme:dark}

.card.over{outline:3px solid var(--acc);outline-offset:2px}
body.tor #pill{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf633}body.tor #tabs-btn{color:#8b5cf6}
body.priv{--bg:#050505;--ink:#e6e6e6;--mute:#777;--card:#161616;--line:#2b2b2b;--acc:#ddd;--glow:#ffffff14;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
#reachveil{position:fixed;left:0;right:0;top:0;height:46vh;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-size:13px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.reach #reachveil{display:flex}body.reach #app{padding-top:46vh}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;flex-direction:column}
body.bottom #app{flex-direction:column-reverse}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.35}
#top{display:flex;gap:6px;align-items:center;padding:8px 10px;position:relative;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);touch-action:pan-y}
body.bottom #top{border-bottom:0;border-top:1px solid var(--line)}
#pill{flex:1;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 3px;height:40px;min-width:0;transition:transform .18s,opacity .18s}
#pill:focus-within{border-color:var(--mute);box-shadow:0 0 0 3px var(--glow)}
#pill.sl{transform:translateX(-28px);opacity:0}#pill.sr{transform:translateX(28px);opacity:0}
#url,#findq{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px;height:100%;text-overflow:ellipsis}
#url::placeholder,#findq::placeholder{color:var(--mute)}
#find{display:none;flex:1;align-items:center;gap:2px;min-width:0}#findn{color:var(--mute);font-size:12px;padding:0 4px;font-variant-numeric:tabular-nums}
#pill.finding #find{display:flex}body.typing #reload{display:none}body.typing #mic{display:grid!important}
.bm i{background-size:60% auto;background-position:center;background-repeat:no-repeat}.card .meta b img,.sug img{width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px}#pill.finding #shield,#pill.finding #url,#pill.finding #reload{display:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--line)}
#shield.off{opacity:.4}#shield.priv::after{content:"";position:absolute;inset:9px;border:1.5px dashed var(--mute);border-radius:50%}
#msgbn{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 10px 30px #0006;transform:translateY(-140%);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .2s;touch-action:none}
#msgbn.on{transform:none;opacity:1}#msgbn i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 14px system-ui;font-style:normal;flex:none}#msgbn div{min-width:0;flex:1;display:grid}#msgbn b{font:650 14px system-ui;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#msgbn span{font:13px system-ui;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#msgbn em{font:700 12px system-ui;font-style:normal;background:var(--acc);color:var(--bg);border-radius:99px;padding:2px 8px}
#msg-btn.msgdot::after,#tb-msg.msgdot::after{content:attr(data-n);position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:var(--bg);font:700 10px/16px system-ui;text-align:center}
body.tools #msg-btn{display:none}body:not(.tools) #tb-msg{display:none}
#menu-btn.msgdot::after{content:attr(data-n);position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:var(--bg);font:700 10px/16px system-ui;text-align:center}
#np{color:var(--acc)}#np.on svg{animation:npb 1.2s ease-in-out infinite alternate}@keyframes npb{to{transform:scale(1.12)}}
#tabs-btn.playing::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.card .snd{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #0003;display:grid;place-items:center}.card .snd svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#tabs-btn span{width:22px;height:22px;border:1.6px solid var(--ink);border-radius:7px;font-weight:600;font-size:12px;display:grid;place-items:center}
body.priv #tabs-btn span{border-style:dashed}
#bar{height:2px;background:var(--acc);width:0;position:absolute;left:0;bottom:-1px;transition:width .4s,opacity .3s;opacity:0}
body.bottom #bar{bottom:auto;top:-1px}
#bar.on{opacity:1;width:70%;transition:width 6s cubic-bezier(.1,.6,.2,1)}#bar.done{opacity:0;width:100%}
#view{flex:1;overflow:auto;position:relative}
/* Bottom toolbar (like Brave): shows on load and when you scroll up, slides away when you scroll down. */
#tools{display:none;flex:none;height:52px;align-items:center;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);transition:margin-bottom .18s ease,opacity .18s}
body.tools #tools{display:flex}body.tools #tabs-btn,body.tools #menu-btn{display:none}
#tools .tb{position:relative}#tb-menu.msgdot::after{content:attr(data-n);position:absolute;top:4px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:var(--bg);font:700 10px/16px system-ui;text-align:center}#tb-tabs.playing::after{content:"";position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--acc)}body.tools.tools-hide #tools{margin-bottom:-53px;opacity:0;pointer-events:none}
body.bottom #tools{order:-1}
#tools .tb{all:unset;width:48px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:12px;cursor:pointer}#tools .tb:active{background:var(--card)}
#tools .tb-av{font:700 13px/26px system-ui;font-style:normal;width:26px;height:26px;border-radius:50%;color:#fff;text-align:center;background:linear-gradient(135deg,#6d5efc,#22b8cf)}
#tools .tb:disabled{opacity:.3}#tools svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tb-tabs span{min-width:20px;height:20px;padding:0 3px;border:1.8px solid currentColor;border-radius:6px;font:700 11px/17px system-ui;text-align:center;box-sizing:border-box}
.home{display:grid;place-items:center;text-align:center;padding:12vh 18px 40px}
.home .wordmark{font:300 62px/1 ui-serif,"Times New Roman",Times,Georgia,serif;letter-spacing:-2px;margin:0 auto 12px}.home p{color:var(--mute)}
.home .stats{font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}.home .stats b{color:var(--ink)}
.home.priv .wordmark{opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin-top:30px;width:100%;max-width:420px}
.bm{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--mute);min-width:0}
.bm i{width:54px;height:54px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:19px;font-weight:600;color:var(--ink);text-transform:uppercase}
.bm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--mute);font-size:12px;margin-top:26px;line-height:1.7}
.sug{padding:6px 10px}.sug button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 8px;border-radius:12px;text-align:left;min-width:0}
.sug button:active,.sug button.sel{background:var(--card)}
.sug i{font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.sug span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.sug small{color:var(--mute);font-size:11px;flex:none}
.sheet.dock{top:auto;height:min(56vh,560px);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgb(0 0 0/.18);border-top:1px solid var(--line);padding-top:6px}
.sheet.dock::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 6px;flex:none}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:none;flex-direction:column;gap:8px;overflow:auto;transition:transform .2s}
.sheet.on{display:flex;animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet h2{font-weight:300;font-size:28px;letter-spacing:-.5px;display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px;touch-action:none}
.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 2px 2px;font-weight:600}
.sheet>*{flex:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;min-height:190px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;min-width:0;touch-action:pan-y;transition:transform .2s,opacity .2s}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}.card.priv{border-style:dashed}
.card .shot{flex:1;background:var(--bg) center top/cover no-repeat;border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font:300 28px ui-serif,Georgia,serif}
.card .meta{padding:8px 10px 10px;min-width:0;display:grid}
.card .x{background:var(--card);border-radius:50%;width:30px;height:30px;top:6px;right:6px;box-shadow:0 1px 3px #0003}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
.card b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{position:absolute;top:4px;right:4px;width:36px;height:36px;color:var(--mute);font-size:16px}
.card .tag{position:absolute;top:12px;left:12px;font-size:11px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips button{flex:none;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--card)}
.chips button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;text-align:center}
.btn.acc{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}.btn.sm{flex:none;padding:7px 12px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;min-height:52px}
.item>div{min-width:0}.item small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:20px}
select,textarea,input.txt{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea,input.txt{width:100%}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.qr{width:220px;height:220px;border-radius:14px;overflow:hidden;margin:6px auto;border:1px solid var(--line)}.qr svg{display:block;width:100%;height:100%}
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-radius:18px 18px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -8px 30px #0003;display:none;flex-direction:column;gap:4px;touch-action:none}
.act.on{display:flex;animation:up .18s ease-out}.act .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.act p{color:var(--mute);font-size:12px;padding:0 6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act button{text-align:left;padding:13px 10px;border-radius:10px;font-size:15px}.act button:active{background:var(--line)}
#scrim{position:fixed;inset:0;background:#0005;z-index:19;display:none}#scrim.on{display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;transition:.25s;z-index:30;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.bottom #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style><link rel=stylesheet href="hush.css"></head><body>

<script>
const TA=window.__TAURI__, $=s=>document.querySelector(s);
const inv=(c,a)=>TA?TA.core.invoke(c,a||{}):Promise.reject("not in app");
const ANDROID=/Android/i.test(navigator.userAgent);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hostOf=u=>{try{return new URL(u).hostname}catch{return""}};
const bare=u=>hostOf(u).replace(/^www\./,"");
const vibe=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const SPK=`<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8a5 5 0 0 1 0 8"/></svg>`,MUT=`<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6"/></svg>`;

  if(name==="floatEnded"){if(floating===d.id)floating=null;return}if(name==="favicon"){if(typeof d.data==="string"&&d.data.startsWith("data:image/png;base64,")&&d.data.length<20000)saveIcon(d.host||"",d.data);return}if(name==="blocked"){HX.siteHit(d.host,+d.n||0);return}
  if(name==="popupBlocked"){HX.bump("pop");toast("🚫 Blocked a popup ad — you stayed on the page");return}
  if(name==="linkTab"){const u=d.url;if(!/^https?:/.test(u))return;const keep=cur,t=newTab(false,true);t.url=u;cur=keep;inv("open_tab",{input:u,space:spaceOf(t.ws)}).then(id=>{t.native=id;inv("switch_tab",{label:T().native||"none"});render()});toast("Opened in a background tab");return}
  if(name==="tabUrl"){const t=tabs.find(x=>x.native===d.id);if(!t)return;t.url=d.url;t.title=d.title||t.title;t.canBack=d.canBack;t.canFwd=d.canFwd;
    if(d.state==="finished"&&torOn)HX.bump("tor");
    if(d.state==="finished"&&t.id===cur){const n=HX.tabNote.get(d.url);if(n)toast("📝 "+n.slice(0,90))}
    if(d.state==="finished"){if(!t.priv&&d.url.startsWith("http"))inv("history_add",{url:d.url,title:t.title||bare(d.url)}).catch(()=>{});saveSession()}
    if(d.state==="started"&&!torOn&&/^https?:/.test(d.url)&&listHas("tor_sites",bare(d.url))){setTor(true);toast("🧅 Tor mode on — you set this site to always use Tor")}

  else if(name==="tabAudio"){const t=tabs.find(x=>x.native===d.id);if(t&&t.audio!==!!d.audio){t.audio=!!d.audio;render();if(sheet==="switcher")drawSwitcher()}}

    else if(d.state==="done")listenSt="";if(sheet==="menu")drawMenu()}
  else if(name==="peek"){if(d.state==="expanded"){const t={id:nid++,native:d.id,url:d.url,title:"",priv:false,ws:curWs(),canBack:false,canFwd:false,last:Date.now()};tabs.push(t);cur=t.id;render();saveSession();toast("Opened as a tab")}}
  else if(name==="pick"){toast("Removed — it stays hidden on "+bare("https://"+d.host));inv("add_custom_filter",{filter:d.host+"##"+d.sel}).then(loadState).catch(()=>{})}
  else if(name==="screenshot"){if(typeof d.data!=="string"||!d.data.startsWith("data:image/png;base64,"))return;show("xs");$("#xs").innerHTML="";const t=T();
    HX.markup(d.data,{name:"Hush "+(t?bare(t.url):""),save:async x=>{await native("saveImage",{data:x});setTimeout(()=>show(null),0);return "Photos › Pictures/Hush"}});
    const obs=new MutationObserver(()=>{if(!document.querySelector(".hx-shot")){obs.disconnect();if(sheet==="xs")show(null)}});obs.observe(document.body,{childList:true})}
  else if(name==="scroll"){const t=T();if(!t||t.native!==d.id||sheet)return;if(d.y<40||d.dir<0)toolsShow(true);else if(d.dir>0)toolsShow(false)}
  else if(name==="bubble"){if(d.a==="open"){const k=bubbleKey;native("bubble",{show:false}).catch(()=>{});openMsgs(k)}}
  else if(name==="gesture"){HX.gesture(d)}
  else if(name==="float"){if(d.a==="open"){floating=null;const t=tabs.find(x=>x.native===d.id);if(t)select(t.id)}else if(d.a==="close")floating=null;

  else if(name==="find"){$("#findn").textContent=d.count?d.index+"/"+d.count:"0"}

    actions(d.kind==="image"?"Image":u,[
      ...(d.kind==="image"?[]:[["Peek — preview without leaving",()=>native("peek",{url:u}).catch(e=>toast(String(e)))]]),

    actions(bare("https://"+d.host)+" wants to use your "+what,[["Allow",()=>native("permissionReply",{allow:true,remember:true})],

  try{t.native=await inv("open_tab",{input:u,space:spaceOf(t.ws)});await inv("switch_tab",{label:T().native||"none"});

  if(u.startsWith("hush:chat:")){openMsgs(u.slice(10));return}if(u==="hush:private")return newTab(true);if(u==="hush:search")return newTab();if(u==="hush:voice"){newTab(false,true);render();return voice()}
  if(/^hush:(\/\/)?add/i.test(u)){const pk=await HM.addFromLink(u);if(pk){openMsgs(pk);toast("Contact added — say hi")}else{openMsgs();toast("Set up Murmur first, then scan again")}return}
  if(u.startsWith("hush://import")||u.startsWith("hush:import")){try{const raw=u.split("#")[1]||"",j=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,"+").replace(/_/g,"/")))));
    const items=(j.b||[]).map(x=>({title:String(x[0]||""),url:String(x[1]||""),folder:String(x[2]||"")})).filter(x=>/^https?:\/\//.test(x.url));
    const tl=(j.t||[]).filter(x=>typeof x==="string"&&/^https:\/\//.test(x)).slice(0,60),st=j.s&&typeof j.s==="object"?j.s:{},sk=Object.keys(st).filter(k=>/^[a-z_]{1,20}$/.test(k)&&typeof st[k]==="string");
    const parts=[items.length?items.length+" bookmarks":"",tl.length?tl.length+" open tabs":"",sk.length?"your settings":""].filter(Boolean);
    if(parts.length&&confirm("Add "+parts.join(", ")+" from your computer?")){if(items.length)await inv("import_bookmarks",{items});
      for(const k of sk)await inv("set_setting",{key:k==="search"?"search":"ui."+k,value:st[k].slice(0,200)}).catch(()=>{});
      await loadState();applyPrefs();for(const u of tl){const t=newTab(false,true);t.url=u}saveSession();render();toast("Synced "+parts.join(", "))}}catch(e){toast("That link couldn’t be read")}return}
  const t=T();if(t&&!t.native)go(u);else{newTab(false,true);go(u)}}
// Memory saver: tabs you haven't looked at for a while give back their memory (they reload when you return).
setInterval(()=>{const m=+pref("memory_saver");if(m>0)native("discardBackground",{minutes:m,keep:tabs.filter(t=>t.awake).map(t=>String(t.id)).join(",")}).catch(()=>{})},60000);

function drawReading(){const el=$("#reading"),list=state.bookmarks.filter(b=>b.folder==="reading");
  el.innerHTML=head("Reading list")+(list.length?list.map((b,i)=>`<div class="item"><div style="flex:1" data-open="${esc(b.url)}">${esc(b.title||bare(b.url))}<small>${esc(bare(b.url))}</small></div><button class="btn sm" data-done-r="${esc(b.url)}">Done</button></div>`).join("")
    :`<div class="empty">Nothing saved yet.<br>Menu → “Read later” adds the page you’re on.</div>`)+`<p class="hint" style="text-align:center">Tip: Menu → “Save as PDF” keeps a page for offline reading.</p>`;
  wire(el);el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{show(null);const t=T();if(t&&t.native){newTab(false,true)}go(b.dataset.open)});
  el.querySelectorAll("[data-done-r]").forEach(b=>b.onclick=async()=>{await inv("bookmark_remove",{url:b.dataset.doneR});await loadState();drawReading()})}

function focusLeft(){return Math.max(0,+pref("focus_until")-Date.now()/1000)}
function drawFocus(){const el=$("#focus"),left=focusLeft(),sites=pref("focus_sites").split(",").map(x=>x.trim()).filter(Boolean);
  el.innerHTML=head("Focus mode")+(left>0?`<div class="item"><div>Focus is on<small>${Math.ceil(left/60)} minutes left · ${sites.length} sites paused</small></div><button class="btn sm" id="f-end">End</button></div>`
    :`<p style="color:var(--mute);margin:0 4px 6px">Pause distracting sites for a while. They show a calm “hush.” page instead.</p>
      <div class="chips">${[25,50,90,180].map(m=>`<button data-min="${m}">${m<60?m+" min":m/60+" h"}</button>`).join("")}</div>`)+
    `<h3>Paused sites</h3>${sites.map(s=>item(esc(s),"",`<button class="btn sm" data-rm="${esc(s)}">Remove</button>`)).join("")}
     <div class="row"><input class="txt" id="f-add" placeholder="Add a site, e.g. news.com" autocapitalize="off"><button class="btn sm" id="f-addb">Add</button></div>`;
  wire(el);
  el.querySelectorAll("[data-min]").forEach(b=>b.onclick=async()=>{await setPref("focus_until",String(Math.floor(Date.now()/1000)+ +b.dataset.min*60));toast("Focus on for "+b.textContent);drawFocus()});
  if($("#f-end"))$("#f-end").onclick=async()=>{await setPref("focus_until","0");drawFocus()};
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{await setPref("focus_sites",sites.filter(x=>x!==b.dataset.rm).join(","));drawFocus()});
  $("#f-addb").onclick=async()=>{const v=bare("https://"+$("#f-add").value.trim().replace(/^https?:\/\//,""));if(v&&!sites.includes(v)){await setPref("focus_sites",[...sites,v].join(","));drawFocus()}}}

async function drawAbout(){const el=$("#about");let info={build:"?"};try{info=await inv("app_info")}catch(e){}
  el.innerHTML=head("About Hush")+`<div style="text-align:center;margin:8px 0 4px"><div class="wordmark" style="font:300 44px ui-serif,'Times New Roman',Georgia,serif">hush.</div>
    <small style="color:var(--mute)">Test build ${esc(info.build)} · Android</small></div>
   <button class="item" id="a-upd"><div>Check for updates<small id="a-updt">Looks for a newer test build on GitHub</small></div></button>
   <button class="item" id="a-def"><div>Make Hush your default browser<small id="a-deft">Links from other apps open here</small></div></button>
   <h3>Privacy policy</h3>
   <div class="item" style="display:block;font-size:13px;line-height:1.6">Hush collects nothing. There are no accounts, no analytics, no crash reports and no Hush servers.
    Your bookmarks, settings and (if you turn it on) history stay on this phone. Hush only connects to the sites you visit, and — when you ask —
    to the filter-list sites (easylist.to, fanboy.co.nz, ublockorigin.github.io) and to GitHub to check for updates.</div>
   <h3>Open-source licenses</h3>
   <div class="item" style="display:block;font-size:12.5px;line-height:1.7">Hush is free software under the <b>GNU GPL v3</b>.<br>
    uBlock Origin scriptlets & filter lists — GPL v3, © Raymond Hill & contributors<br>adblock-rust — MPL 2.0, © Brave Software<br>
    EasyList, EasyPrivacy — GPL v3 / CC BY-SA 3.0, © The EasyList authors<br>Fanboy’s Cookie List — © Fanboy & contributors<br>
    Tauri, wry, tao — MIT / Apache 2.0<br>AndroidX libraries — Apache 2.0<br>QR code generator based on Project Nayuki’s algorithm — MIT</div>`;
  wire(el);
  $("#a-upd").onclick=async()=>{$("#a-updt").textContent="Checking…";try{const u=await inv("check_update");
      if(u.newer){$("#a-updt").textContent=`Build ${u.latest} is ready — tap to open it`;$("#a-upd").onclick=()=>{show(null);newTab(false,true);go(u.page)}}
      else $("#a-updt").textContent="You’re on the newest build ("+u.latest+")"}
    catch(e){if(String(e).includes("private")){$("#a-updt").textContent="Your GitHub repo is private — tap to open the releases page";$("#a-upd").onclick=()=>{show(null);newTab(false,true);go("https://github.com/wmitch3ll/hush/releases")}}
      else $("#a-updt").textContent="Couldn’t check right now"}};
  $("#a-def").onclick=()=>native("askDefault");
  native("isDefault").then(r=>{if(r&&r.default)$("#a-deft").textContent="Hush is your default browser ✓"}).catch(()=>{})}

async function loadState(first){try{state=await inv("get_state");state.settings.ui=state.settings.ui||{};state.site_dark=state.site_dark||{};allow=new Set(state.allow_sites||[])}catch(e){}
  applyPrefs();
  if(first&&pref("restore")==="on"&&state.session?.length){tabs=[];state.session.forEach(s=>tabs.push({id:nid++,native:null,url:s.url,title:"",priv:false,ws:wsList().includes(s.ws)?s.ws:curWs(),canBack:false,canFwd:false}));
    const last=inWs().at(-1);if(last){cur=last.id;openNative(last)}else newTab(false,true);toast("Restored "+state.session.length+" tabs")}
  render()}
newTab(false,true);render();loadState(true).then(()=>{handleIncoming();if(!state.settings.ui?.toured)setTimeout(startTour,600)});

setTimeout(()=>{try{splitMode()}catch(e){}},1500);

inv('app_info').then(r=>{window.__hushBuild=r&&r.build}).catch(()=>{});
</script>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hush</title>
<style>
/* Grayscale tokens — same names as ui/index.html. Light / dark (system) / forced via [data-theme]. */
:root{--bg:#f2f2f2;--ink:#111;--mute:#8c8c8c;--card:#fff;--line:#e0e0e0;--acc:#111;--glow:#00000014;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--ink:#eee;--mute:#808080;--card:#1a1a1a;--line:#2a2a2a;--acc:#eee;--glow:#ffffff14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--ink:#eee;--mute:#808080;--card:#1a1a1a;--line:#2a2a2a;--acc:#eee;--glow:#ffffff14;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;flex-direction:column}
body.bottom #app{flex-direction:column-reverse}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
#top{display:flex;gap:6px;align-items:center;padding:8px 10px;position:relative;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body.bottom #top{border-bottom:0;border-top:1px solid var(--line)}
#pill{flex:1;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 3px;height:38px;min-width:0}
#pill:focus-within{border-color:var(--mute);box-shadow:0 0 0 3px var(--glow)}
#url{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px;height:100%;text-overflow:ellipsis}
#url::placeholder{color:var(--mute)}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--line)}.ib:disabled{opacity:.3}
#shield.off{opacity:.4}
#tabs-btn span{width:22px;height:22px;border:1.6px solid var(--ink);border-radius:7px;font-weight:600;font-size:12px;display:grid;place-items:center}
#bar{height:2px;background:var(--acc);width:0;position:absolute;left:0;bottom:-1px;transition:width .4s,opacity .3s;opacity:0}
body.bottom #bar{bottom:auto;top:-1px}
#bar.on{opacity:1;width:70%;transition:width 6s cubic-bezier(.1,.6,.2,1)}
#bar.done{opacity:0;width:100%}
#view{flex:1;overflow:auto;position:relative}
.home{display:grid;place-items:center;text-align:center;padding:12vh 18px 40px}
.home h1 .wordmark{display:block;height:64px;width:auto;margin:0 auto 14px}.home h1{font-weight:200;font-size:64px;letter-spacing:-3px}.home p{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin-top:32px;width:100%;max-width:420px}
.bm{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--mute);min-width:0}
.bm i{width:54px;height:54px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:19px;font-weight:600;color:var(--ink);text-transform:uppercase}
.bm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:none;flex-direction:column;gap:8px;overflow:auto}
.sheet.on{display:flex;animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.sheet h2{font-weight:300;font-size:28px;letter-spacing:-.5px;display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 2px 2px;font-weight:600}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:110px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;min-width:0}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.card b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{position:absolute;top:4px;right:4px;width:34px;height:34px;color:var(--mute);font-size:16px}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;text-align:center}
.btn.acc{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.sheet>.btn,.sheet>textarea{flex:none}
.btn.sm{flex:none;padding:7px 12px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;min-height:52px}
.item>div{min-width:0}.item small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on{background:var(--ink)}.sw.on::after{left:20px}
select,textarea,input.txt{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
textarea,input.txt{width:100%}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;transition:.25s;z-index:30;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id="app">
  <div id="top">
    <div id="pill">
      <button class="ib" id="shield" aria-label="Shield for this site"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></button>
      <input id="url" inputmode="url" enterkeyhint="go" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
      <button class="ib" id="reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/></svg></button>
    </div>
    <button id="tabs-btn" class="ib" aria-label="Tabs"><span>1</span></button>
    <button id="menu-btn" class="ib" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></button>
    <div id="bar"></div>
  </div>
  <div id="view"></div>
</div>
<div class="sheet" id="switcher"></div>
<div class="sheet" id="menu"></div>
<div class="sheet" id="settings"></div>
<div class="sheet" id="downloads"></div>
<div id="toast" role="status"></div>
<script>
const TA=window.__TAURI__, $=s=>document.querySelector(s);
const inv=(c,a)=>TA?TA.core.invoke(c,a||{}):Promise.reject("not in app");
const ANDROID=/Android/i.test(navigator.userAgent);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hostOf=u=>{try{return new URL(u).hostname}catch{return""}};
let state={settings:{search:"duckduckgo",ui:{}},bookmarks:[],allow_sites:[]}, allow=new Set();
// tabs: {id, native (label of the native WebView, null = start page), url, canBack, canFwd}
let tabs=[], cur=null, nid=1, sheet=null, downloads=[];
const T=()=>tabs.find(t=>t.id===cur);

// ---------- preferences (stored in Rust as ui.<name>) ----------
const DEF={bar_pos:"top",theme:"system",text_zoom:"100",desktop:"false"};
const pref=k=>state.settings.ui?.[k]??DEF[k];
async function setPref(k,v){state.settings.ui[k]=String(v);applyPrefs();try{await inv("set_setting",{key:"ui."+k,value:String(v)})}catch(e){}}
function applyPrefs(){
  const t=pref("theme");if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=t;
  document.body.classList.toggle("bottom",pref("bar_pos")==="bottom");
  inv("set_web_prefs",{textZoom:+pref("text_zoom"),desktop:pref("desktop")==="true"}).catch(()=>{});
  requestAnimationFrame(insets);
}
// Native tab views sit between the bars. Android wants device pixels.
function insets(){
  const a=$("#app").getBoundingClientRect(), b=$("#top").getBoundingClientRect(), k=ANDROID?devicePixelRatio:1, bottom=pref("bar_pos")==="bottom";
  const top=bottom?a.top+parseFloat(getComputedStyle($("#app")).paddingTop):b.bottom;
  const bot=bottom?innerHeight-b.top:innerHeight-a.bottom+parseFloat(getComputedStyle($("#app")).paddingBottom);
  inv("set_chrome_inset",{px:Math.round(top*k),bottom:Math.round(Math.max(0,bot)*k)}).catch(()=>{});
}
addEventListener("resize",()=>insets());

// ---------- tabs ----------
function newTab(){const t={id:nid++,native:null,url:"",canBack:false,canFwd:false};tabs.push(t);select(t.id);setTimeout(()=>$("#url").focus(),60);return t}
function select(id){cur=id;show(null);render()}
function syncNative(){const t=T();inv("switch_tab",{label:!sheet&&t&&t.native?t.native:"none"}).catch(()=>{})}
async function closeTab(id){const t=tabs.find(x=>x.id===id);if(t&&t.native)inv("close_tab",{label:t.native}).catch(()=>{});
  tabs=tabs.filter(x=>x.id!==id);if(!tabs.length){newTab();return}if(cur===id)cur=tabs.at(-1).id;render();if(sheet==="switcher")drawSwitcher()}
async function go(v){
  v=v.trim();if(!v)return;const t=T();$("#url").blur();progress(true);
  try{ if(t.native) await inv("navigate",{input:v}); else { t.native=await inv("open_tab",{input:v}); } }
  catch(e){progress(false);return toast("Couldn’t open that page")}
  t.url=v.includes(".")&&!v.includes(" ")?(/^https?:/.test(v)?v:"https://"+v):v; render();
}
function render(){
  const t=T(), h=t?hostOf(t.url):"";
  if(document.activeElement!==$("#url"))$("#url").value=t&&t.native?h.replace(/^www\./,""):"";
  $("#shield").classList.toggle("off",allow.has(h));$("#shield").disabled=!h;
  $("#tabs-btn span").textContent=tabs.length;
  $("#view").innerHTML=t&&t.native?"":`<div class="home"><h1><svg class="wordmark" viewBox="-30 -30 1180 460" role="img" aria-label="hush."><g fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0V400M0 400V260c0-70 42-110 100-110s100 40 100 110v140"/><path transform="translate(290 0)" d="M0 150v140c0 70 42 110 100 110s100-40 100-110V150M200 150v250"/><path transform="translate(580 0)" d="M152 190c-18-26-44-40-76-40-44 0-72 24-72 58 0 74 152 42 152 124 0 42-34 68-82 68-36 0-66-14-84-40"/><path transform="translate(820 0)" d="M0 0V400M0 400V260c0-70 42-110 100-110s100 40 100 110v140"/></g><circle cx="1112" cy="393" r="30" fill="currentColor"/></svg></h1><p>nothing here but you.</p><div class="grid">${
    state.bookmarks.slice(0,12).map((b,i)=>`<button class="bm" data-bm="${i}"><i>${esc((hostOf(b.url).replace(/^www\./,"")||"?")[0])}</i><span>${esc(b.title||hostOf(b.url))}</span></button>`).join("")}</div></div>`;
  $("#view").querySelectorAll("[data-bm]").forEach(b=>{const bm=state.bookmarks[b.dataset.bm];b.onclick=()=>go(bm.url);
    let lp;b.ontouchstart=()=>{lp=setTimeout(async()=>{if(confirm("Remove bookmark "+(bm.title||bm.url)+"?")){await inv("bookmark_remove",{url:bm.url});await loadState()}},600)};b.ontouchend=b.ontouchmove=()=>clearTimeout(lp)});
  syncNative();
}
function progress(on){const b=$("#bar");b.classList.remove("done");if(on){b.classList.remove("on");void b.offsetWidth;b.classList.add("on")}else{b.classList.remove("on");b.classList.add("done")}}

// ---------- events from the Android plugin (window.__hushEvent) ----------
window.__hushEvent=(name,d)=>{
  if(name==="tabUrl"){const t=tabs.find(x=>x.native===d.id);if(!t)return;t.url=d.url;t.canBack=d.canBack;t.canFwd=d.canFwd;
    if(t.id===cur){progress(d.state==="started");render()}}
  else if(name==="download"){
    if(d.state==="started"){downloads.unshift({name:d.name,state:"started"});toast("Downloading "+d.name+" — see notifications")}
    else{downloads.unshift({name:d.name,state:"failed"});toast("Download failed"+(d.error?": "+d.error:""))}
    if(sheet==="downloads")drawDownloads()}
  else if(name==="back"){if(sheet)show(null);else if(T()?.native&&tabs.length>1)closeTab(cur)}
};

// ---------- sheets ----------
function show(id){sheet=id;["switcher","menu","settings","downloads"].forEach(s=>$("#"+s).classList.toggle("on",s===id));syncNative()}
const head=(title)=>`<h2>${title}<button class="btn sm" data-done>Done</button></h2>`;
const wire=el=>el.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>show(null));
const item=(label,sub,right="")=>`<div class="item"><div>${label}${sub?`<small>${sub}</small>`:""}</div>${right}</div>`;
const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${pref(k)===v?"on":""}">${l}</button>`).join("")}</div>`;

function drawSwitcher(){const el=$("#switcher");
  el.innerHTML=head("Tabs")+`<button class="btn acc" id="sw-new">＋ New tab</button><div class="cards">${tabs.map(t=>{const h=hostOf(t.url).replace(/^www\./,"");
    return`<div class="card ${t.id===cur?"cur":""}" data-id="${t.id}"><button class="x" data-x="${t.id}" aria-label="Close tab">✕</button><b>${esc(h||"New tab")}</b><small>${t.native?esc(t.url.replace(/^https:\/\//,"")):"Start page"}</small></div>`}).join("")}</div>`;
  wire(el);$("#sw-new").onclick=newTab;
  el.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.dataset.x)return;select(+c.dataset.id)});
  el.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>closeTab(+b.dataset.x))}
function drawMenu(){const el=$("#menu"),t=T(),live=!!(t&&t.native);
  el.innerHTML=head("Menu")+`<div class="row"><button class="btn" id="m-back" ${live&&t.canBack?"":"disabled"}>‹ Back</button><button class="btn" id="m-fwd" ${live&&t.canFwd?"":"disabled"}>Forward ›</button></div>
   <button class="item" id="m-bm" ${live?"":"disabled"}><div>Bookmark this page<small>shows on the start page</small></div></button>
   <button class="item" id="m-dl"><div>Downloads<small>saved to your Downloads folder</small></div></button>
   <button class="item" id="m-set"><div>Settings<small>layout · theme · text size · search · privacy</small></div></button>
   <button class="item" id="m-clear"><div>Clear browsing data<small>cookies · cache · site storage</small></div></button>`;
  wire(el);
  $("#m-back").onclick=()=>{show(null);inv("nav",{action:"back"})};$("#m-fwd").onclick=()=>{show(null);inv("nav",{action:"fwd"})};
  $("#m-bm").onclick=async()=>{try{await inv("bookmark_add",{title:hostOf(t.url).replace(/^www\./,""),url:t.url});await loadState();show(null);toast("Bookmarked")}catch(e){toast("Couldn’t save")}};
  $("#m-dl").onclick=()=>{drawDownloads();show("downloads")};$("#m-set").onclick=()=>{drawSettings();show("settings")};
  $("#m-clear").onclick=clearData}
function drawDownloads(){const el=$("#downloads");
  el.innerHTML=head("Downloads")+(downloads.length?downloads.map(d=>item(esc(d.name),d.state==="started"?"Downloading — open it from the notification or your Downloads folder":"Failed")).join("")
    :`<div class="empty">Nothing downloaded yet.<br>Files go to your phone’s Downloads folder.</div>`);wire(el)}
function drawSettings(){const el=$("#settings"),s=state.settings;
  el.innerHTML=head("Settings")+`<h3>Layout</h3>
   ${item("Address bar","",seg("bar_pos",[["top","Top"],["bottom","Bottom"]]))}
   ${item("Theme","",seg("theme",[["system","Auto"],["light","Light"],["dark","Dark"]]))}
   <h3>Pages</h3>
   ${item("Text size","",seg("text_zoom",[["85","S"],["100","M"],["115","L"],["130","XL"]]))}
   ${item("Desktop site","Ask sites for their full desktop layout",`<button class="sw ${pref("desktop")==="true"?"on":""}" id="s-desk" aria-label="Desktop site"></button>`)}
   <h3>Search</h3>
   ${item("Search engine","",`<select id="s-engine">${[["duckduckgo","DuckDuckGo"],["brave","Brave"],["startpage","Startpage"],["ecosia","Ecosia"],["custom","Custom…"]].map(([v,l])=>`<option value="${v}" ${s.search===v?"selected":""}>${l}</option>`).join("")}</select>`)}
   ${s.search==="custom"?`<input class="txt" id="s-custom" placeholder="https://example.com/search?q=%s" value="${esc(s.custom_search)}">`:""}
   <h3>Privacy</h3>
   <button class="item" id="s-lists"><div>Update filter lists<small>download the latest EasyList + EasyPrivacy</small></div></button>
   <button class="item" id="s-clear"><div>Clear browsing data<small>cookies · cache · site storage</small></div></button>
   ${allow.size?[...allow].map(h=>item(esc(h),"Shield off on this site",`<button class="btn sm" data-allow="${esc(h)}">Turn on</button>`)).join(""):item("Shield exceptions","None — the shield is on everywhere")}
   <h3>Your data</h3>
   <button class="item" id="s-export"><div>Export<small>copy settings, bookmarks and filters as text</small></div></button>
   <textarea id="s-json" rows="3" placeholder="Paste an export here to import it"></textarea>
   <button class="btn" id="s-import">Import</button>
   <p style="color:var(--mute);font-size:12px;text-align:center;margin-top:14px">Hush keeps everything on this device. No accounts, no tracking.</p>`;
  wire(el);
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{await setPref(b.dataset.k,b.dataset.v);drawSettings()});
  $("#s-desk").onclick=async()=>{await setPref("desktop",pref("desktop")==="true"?"false":"true");drawSettings()};
  $("#s-engine").onchange=async e=>{s.search=e.target.value;await inv("set_setting",{key:"search",value:s.search});drawSettings()};
  const cs=$("#s-custom");if(cs)cs.onchange=async()=>{const v=cs.value.trim();if(!v.startsWith("https://")||!v.includes("%s"))return toast("Must start with https:// and contain %s");
    s.custom_search=v;await inv("set_setting",{key:"custom_search",value:v});toast("Saved")};
  $("#s-lists").onclick=async()=>{toast("Updating…");try{toast(await inv("update_lists"))}catch(e){toast("Update failed")}};
  $("#s-clear").onclick=clearData;
  el.querySelectorAll("[data-allow]").forEach(b=>b.onclick=async()=>{await inv("toggle_shield",{host:b.dataset.allow});allow.delete(b.dataset.allow);drawSettings();render()});
  $("#s-export").onclick=async()=>{try{const j=await inv("export_data");try{await navigator.clipboard.writeText(j);toast("Copied")}catch(e){$("#s-json").value=j;toast("Select the text above to copy it")}}catch(e){toast("Export failed")}};
  $("#s-import").onclick=async()=>{try{await inv("import_data",{json:$("#s-json").value});await loadState();drawSettings();toast("Imported")}catch(e){toast("Not a Hush export")}};
}
function clearData(){if(confirm("Clear cookies, cache and site data for every site?")){inv("clear_data");show(null);toast("Browsing data cleared")}}

// ---------- bar ----------
$("#url").addEventListener("focus",e=>{const t=T();e.target.value=t&&t.native?t.url:"";setTimeout(()=>e.target.select(),0)});
$("#url").addEventListener("blur",()=>setTimeout(render,0));
$("#url").addEventListener("keydown",e=>{if(e.key==="Enter")go(e.target.value)});
$("#reload").onclick=()=>{const t=T();if(t&&t.native){progress(true);inv("nav",{action:"reload"})}};
$("#shield").onclick=async()=>{const t=T(),h=hostOf(t?.url);if(!h)return;await inv("toggle_shield",{host:h});
  allow.has(h)?allow.delete(h):allow.add(h);toast(allow.has(h)?"Shield off for "+h:"Shield on for "+h);render();inv("nav",{action:"reload"})};
$("#tabs-btn").onclick=()=>{drawSwitcher();show("switcher")};
$("#menu-btn").onclick=()=>{drawMenu();show("menu")};

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
async function loadState(){try{state=await inv("get_state");state.settings.ui=state.settings.ui||{};allow=new Set(state.allow_sites||[])}catch(e){}applyPrefs();render()}
newTab();loadState();
</script>
</body></html>

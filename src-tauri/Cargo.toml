[package]
name = "hush"
version = "0.1.0"
edition = "2021"

[lib]
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["new-window-api"]
# Disable if your pinned Tauri lacks WebviewBuilder::on_new_window (then rely on harden.js + on_navigation).
new-window-api = []

[dependencies]
tauri = { version = "2", features = ["unstable"] }   # "unstable" = multi-webview (tabs as child webviews)
adblock = { version = "0.10", default-features = false, features = ["content-blocking", "embedded-domain-resolver"] }  # pin to latest 0.x you verify
rmp = "=0.8.14"   # adblock 0.10 -> rmp-serde 0.15 breaks on rmp 0.8.15+
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
parking_lot = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }  # user-triggered list updates only
zip = { version = "2", default-features = false, features = ["deflate"] }   # desktop extensions (.crx unpack)
sha2 = "0.10"
base64 = "0.22"
# Built-in Tor (Arti). rustls (no OpenSSL) + bundled SQLite so it builds the same on Windows and Android.
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "onion-service-client"] }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
scraper = { version = "0.20", default-features = false }   # change watch: read one element from a page
# Messenger: WebSockets to Nostr relays over Tor (TLS with ring — no C toolchain needed on Android).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = "thin"          # thin + parallel codegen: much faster CI builds (Tor is a lot of code)
codegen-units = 16
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"   # keep in lockstep with the version wry/tauri resolves (cargo tree -i webview2-com)
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Monthly update pull requests (fewer build minutes). Security alerts still show under the repo's Security tab.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: adblock        # pinned on purpose (rmp-serde compatibility); upgrade deliberately
      - dependency-name: rmp
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1

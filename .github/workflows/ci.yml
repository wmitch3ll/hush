# Unverified starter CI (R-65). Desktop: compile + unit tests. Android: debug APK artifact.
name: ci
on: [push, pull_request]
jobs:
  desktop:
    strategy: { matrix: { os: [ubuntu-22.04, windows-latest, macos-latest] }, fail-fast: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: sh tools/fetch-lists.sh
        shell: bash
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee test.log
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -nE -A6 "^error|panicked|FAILED" test.log | head -80 > err.txt || true
          [ -s err.txt ] || tail -60 test.log > err.txt
          msg=$(sed -e 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Desktop build failed::${msg}"
  android:
    # Builds a debug APK and, on pushes to main, publishes it as a GitHub Release ("Hush test build N").
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri", key: android }
      # Gradle calls back into the CLI that ran `init`; the cargo-installed one is what it expects. rust-cache keeps the binary.
      - run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - run: sh tools/fetch-lists.sh
      - name: Refresh uBlock Origin scriptlets (YouTube / anti-adblock)
        run: |
          git clone -q --depth 1 https://github.com/gorhill/uBlock /tmp/ublock
          git clone -q --depth 1 --branch gh-pages https://github.com/uBlockOrigin/uAssets /tmp/uassets
          node tools/build-scriptlets.mjs /tmp/ublock /tmp/uassets
      # Permanent signing key so each build installs over the last one (main branch only).
      # Uses the HUSH_KEYSTORE_B64 secret if you add one; otherwise one key is generated once and kept in the Actions cache.
      - name: Restore signing key
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with: { path: ~/.hush, key: hush-signing-v1 }
      - name: Prepare signing key
        if: github.ref == 'refs/heads/main'
        id: key
        shell: bash
        env: { KS_B64: "${{ secrets.HUSH_KEYSTORE_B64 }}" }
        run: |
          mkdir -p ~/.hush
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ~/.hush/hush.jks
          elif [ ! -f ~/.hush/hush.jks ]; then
            keytool -genkeypair -keystore ~/.hush/hush.jks -alias hush -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass hushdebug -keypass hushdebug -dname "CN=Hush, O=Hush Browser" -noprompt
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
          echo "HUSH_KEYSTORE=$HOME/.hush/hush.jks" >> "$GITHUB_ENV"
      - name: Back up a newly created signing key
        if: steps.key.outputs.new == '1'
        uses: actions/upload-artifact@v4
        with: { name: SIGNING-KEY-BACKUP-keep-private, path: ~/.hush/hush.jks, retention-days: 90 }
      - name: Version from build number
        shell: bash
        run: |
          sed -i 's/"version": "[^"]*"/"version": "0.1.${{ github.run_number }}"/' src-tauri/tauri.conf.json
      - name: Build APK
        shell: bash
        env: { HUSH_BUILD: "${{ github.run_number }}" }
        run: |
          set -o pipefail
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cd src-tauri
          # icon runs AFTER init so it also writes the launcher icons into gen/android (else Tauri's placeholder shows).
          { cargo tauri android init --ci &&
            cargo tauri icon icons/source.png &&
            (cd .. && sh tools/android-post-init.sh) &&
            cargo tauri android build --debug --apk --target aarch64 --ci ; } 2>&1 | tee ../build.log
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          # Full logs can't always be downloaded; surface the important lines where `gh run view` shows them.
          grep -nE "error(\[|:)|Error:|FAILURE|What went wrong|e: |Unresolved|cannot find|not found" build.log | head -60 > err.txt || true
          [ -s err.txt ] || tail -60 build.log > err.txt
          msg=$(sed -e 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build failed::${msg}"
      - name: Collect APK
        run: |
          f=$(find src-tauri/gen/android -name "*.apk" | head -1); echo "found $f"
          cp "$f" hush-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: hush-debug-apk, path: hush-debug.apk }
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}", MSG: "${{ github.event.head_commit.message }}" }
        run: |
          gh release create "build-${{ github.run_number }}" hush-debug.apk --prerelease \
            --title "Hush test build ${{ github.run_number }}" \
            --notes "Debug build of $(git rev-parse --short HEAD): $MSG"
